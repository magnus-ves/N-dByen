<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#DCE6E0">
<meta name="description" content="NødByen – et rolig beredskapsspill om 110, 112 og 113, frivillige og Nødnett.">
<title>NødByen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   NødByen – stil: «organisk app»
   Salvie, krem, sand, leire og dempet havblå. Myke former, glass, rolige animasjoner.
   ========================================================================== */
:root{
  --cream:#F7F1E4; --cream2:#EFE6D2; --sand:#E6D6B4; --sage:#A9C0A2; --sage-d:#7B9A79; --moss:#3E4A3F;
  --ink:#3A453B; --muted:#6F7B6E; --line:rgba(62,74,63,.12);
  --brann:#C9785D; --politi:#6F8FB5; --amb:#B3BE68; --amb2:#98B889; --frivillig:#D98A82; --strand:#E5A267; --net:#A99BCB; --sea:#6E9BAE;
  --p1:#D9695A; --p2:#E4AE4E; --p3:#8DB588; --p4:#8FA3B8;
  --glass:rgba(250,246,236,.76); --glass-b:rgba(255,255,255,.7);
  --shadow:0 10px 34px rgba(62,74,63,.17); --shadow-s:0 4px 14px rgba(62,74,63,.12);
  --ease:cubic-bezier(.22,.8,.3,1);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe7e1;color:var(--ink);
  font-family:'Nunito','Quicksand',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-weight:600;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid rgba(123,154,121,.55);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden}
#view{position:absolute;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.hidden{display:none!important}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);border:1px solid var(--glass-b);box-shadow:var(--shadow)}

/* ---------- knapper og småting ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.72);
  border:1px solid var(--line);font-weight:800;font-size:13.5px;line-height:1.1;box-shadow:var(--shadow-s);transition:transform .18s var(--ease),background .2s,box-shadow .2s,opacity .2s;white-space:nowrap}
.btn:hover{background:#fff}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--sage-d);color:#fff;border-color:transparent}
.btn.primary:hover{background:#6c8b6a}
.btn.clay{background:var(--brann);color:#fff;border-color:transparent}
.btn.net{background:var(--net);color:#fff;border-color:transparent}
.btn.warn{background:var(--p2);color:#4a3a14;border-color:transparent}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.xs{padding:4px 10px;font-size:11.5px}
.btn[disabled],.btn.dis{opacity:.45;pointer-events:none;box-shadow:none}
.ib{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;background:rgba(255,255,255,.7);border:1px solid var(--line);box-shadow:var(--shadow-s);transition:transform .18s var(--ease),background .2s}
.ib:active{transform:scale(.92)} .ib:hover{background:#fff}
.ib.on{background:var(--net);color:#fff;border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800;background:rgba(62,74,63,.08);color:var(--ink);white-space:nowrap}
.chip.p1{background:rgba(217,105,90,.18);color:#9c3f33}.chip.p2{background:rgba(228,174,78,.24);color:#85601a}.chip.p3{background:rgba(141,181,136,.28);color:#476a43}.chip.p4{background:rgba(143,163,184,.28);color:#4a5d73}
.chip.brann{background:rgba(201,120,93,.2);color:#8c4a35}.chip.politi{background:rgba(111,143,181,.2);color:#3f5f86}.chip.ambulanse{background:rgba(179,190,104,.28);color:#5f6a22}
.chip.rk,.chip.nf,.chip.frivillig{background:rgba(217,138,130,.22);color:#9a4a43}.chip.strand{background:rgba(229,162,103,.26);color:#8f5a22}.chip.nodnett,.chip.net{background:rgba(169,155,203,.28);color:#5b4d86}
.chip.ok{background:rgba(141,181,136,.28);color:#3f6a3b}.chip.bad{background:rgba(217,105,90,.2);color:#9c3f33}.chip.mute{background:rgba(62,74,63,.07);color:var(--muted)}
.bar{height:7px;border-radius:99px;background:rgba(62,74,63,.1);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--sage-d);transition:width .5s var(--ease),background .3s}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.sp{height:8px}
.muted{color:var(--muted)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:800}.r{text-align:right}
h3.sec{margin:14px 2px 8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:900}
h3.sec:first-child{margin-top:4px}

/* ---------- topplinje ---------- */
#topbar{position:absolute;left:10px;right:10px;top:calc(10px + var(--safe-t));z-index:20;border-radius:26px;padding:6px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px;transition:opacity .4s}
.tb-br{display:none}
.tb-speed{order:9}
.tb-city{display:flex;flex-direction:column;line-height:1.05;padding:0 8px 0 2px;min-width:78px}
.tb-city b{font-size:15px;font-weight:900}.tb-city small{font-size:11px;color:var(--muted);font-weight:700}
.tbc{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.62);border:1px solid var(--line);font-weight:800;font-size:13px;white-space:nowrap}
.tbc .ic{color:var(--muted)}
.tbc.money{font-variant-numeric:tabular-nums}.tbc.money.neg{color:#9c3f33}
.tbc.clickable{cursor:pointer}
.ring{width:22px;height:22px;transform:rotate(-90deg);flex:none}.ring circle{fill:none;stroke-width:3.6;stroke-linecap:round}
.ring .bg{stroke:rgba(62,74,63,.13)}.ring .fg{stroke:var(--sage-d);transition:stroke-dasharray .6s var(--ease),stroke .3s}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#8DB588;box-shadow:0 0 0 3px rgba(141,181,136,.25);transition:background .3s}
.dot.y{background:#E4AE4E;box-shadow:0 0 0 3px rgba(228,174,78,.28)}.dot.r{background:#D9695A;box-shadow:0 0 0 3px rgba(217,105,90,.28)}
.tb-speed{margin-left:auto;display:flex;gap:3px;padding:3px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid var(--line)}
@media(max-width:899px){#btnMenu{order:0}.tb-city{order:1}#tbNet{order:2}.tb-speed{order:3}.tb-br{order:4;display:block;flex-basis:100%;height:0}#tbClock{order:5}#tbMoney{order:6}#tbReady{order:7}#tbInc{order:8}.tbc{padding:5px 9px;font-size:12.5px;gap:5px}.tbc.net span:last-child{display:none}.tb-speed button{width:32px;height:28px}.tb-city{min-width:0;flex:1}.tb-city b{font-size:14.5px}}
.tb-speed button{width:34px;height:30px;border-radius:99px;display:grid;place-items:center;font-weight:900;font-size:12px;color:var(--muted);transition:background .2s,color .2s}
.tb-speed button.on{background:var(--sage-d);color:#fff}
#tbInc.has{background:rgba(228,174,78,.3)} #tbInc.hot{background:rgba(217,105,90,.28)}
@media(min-width:900px){#topbar{right:442px}}

/* nødknapp-alarm */
#alarmBar{position:absolute;left:50%;top:calc(var(--topH,104px) + 8px + var(--safe-t));transform:translateX(-50%);z-index:25;max-width:min(560px,calc(100% - 20px));width:max-content}
.alarm{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:22px;background:#d9695a;color:#fff;font-weight:900;box-shadow:0 8px 28px rgba(217,105,90,.55);animation:alarmPulse 1s ease-in-out infinite;margin-bottom:6px}
.alarm small{font-weight:700;opacity:.92;display:block}
@keyframes alarmPulse{0%,100%{transform:scale(1);box-shadow:0 8px 28px rgba(217,105,90,.45)}50%{transform:scale(1.025);box-shadow:0 8px 40px rgba(217,105,90,.85)}}

/* kartverktøy */
#mapTools{position:absolute;z-index:15;left:10px;top:calc(var(--topH,104px) + 8px + var(--safe-t));display:flex;flex-direction:column;gap:8px}
#mapTools .ib{width:42px;height:42px}
#weatherChip{position:absolute;z-index:14;left:10px;bottom:auto;top:calc(104px + var(--safe-t));margin-left:54px}

/* mini-logg */
#miniLog{position:absolute;z-index:14;left:10px;bottom:10px;width:min(430px,calc(100% - 20px));pointer-events:none;display:flex;flex-direction:column;gap:4px}
.mlog{padding:6px 12px;border-radius:16px;font-size:12px;font-weight:700;background:rgba(250,246,236,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--glass-b);box-shadow:var(--shadow-s);
  animation:slideIn .4s var(--ease);transition:opacity .8s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlog.old{opacity:.0}
@keyframes slideIn{from{transform:translateY(8px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.tg{display:inline-block;padding:1px 8px;border-radius:99px;font-size:10.5px;font-weight:900;letter-spacing:.04em;margin-right:6px;background:rgba(62,74,63,.12)}
.tg.BRANN{background:rgba(201,120,93,.25);color:#8c4a35}.tg.POLITI{background:rgba(111,143,181,.25);color:#3f5f86}.tg.HELSE{background:rgba(179,190,104,.35);color:#5f6a22}
.tg.REDNING{background:rgba(217,138,130,.28);color:#9a4a43}.tg.SAMVIRKE{background:rgba(169,155,203,.38);color:#54447f}.tg.NODNETT,.tg.NØDNETT{background:rgba(169,155,203,.3);color:#5b4d86}.tg.SENTRAL{background:rgba(62,74,63,.14)}
@media(min-width:900px){#miniLog{right:auto}}
@media(max-width:899px){#miniLog{bottom:calc(var(--sheetPeek,70px) + 18px);width:calc(100% - 20px)}.mlog:nth-child(n+3){display:none}}

/* valgt objekt / etiketter */
#labels{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.wl{position:absolute;transform:translate(-50%,-100%);padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:800;background:rgba(250,246,236,.82);border:1px solid var(--glass-b);box-shadow:var(--shadow-s);white-space:nowrap;color:var(--ink);transition:opacity .25s}
.wl.sel{background:var(--sage-d);color:#fff;font-size:12px;padding:4px 12px;z-index:3}
.wl.strandl{background:rgba(229,162,103,.9);color:#fff}
#placeBar{position:absolute;z-index:30;left:50%;top:calc(var(--topH,104px) + 8px + var(--safe-t));transform:translateX(-50%);padding:10px 14px;border-radius:24px;text-align:center;max-width:min(520px,calc(100% - 20px));width:max-content}
#placeBar .row{justify-content:center;margin-top:8px}

/* ---------- panel ---------- */
#panel{position:absolute;z-index:18;display:flex;flex-direction:column;border-radius:28px;overflow:hidden;transition:height .45s var(--ease),transform .45s var(--ease)}
@media(min-width:900px){#panel{top:calc(10px + var(--safe-t));right:10px;bottom:10px;width:422px}#sheetHandle{display:none}}
@media(max-width:899px){#panel{left:8px;right:8px;bottom:calc(8px + var(--safe-b));height:var(--sheetH,46vh);max-height:calc(100% - 130px)}
  #panel.s0{--sheetH:calc(68px)} #panel.s1{--sheetH:46vh} #panel.s2{--sheetH:calc(100% - 128px)}}
#sheetHandle{height:20px;display:grid;place-items:center;cursor:grab;touch-action:none;flex:none}
#sheetHandle i{width:44px;height:5px;border-radius:9px;background:rgba(62,74,63,.2)}
#tabs{display:flex;gap:2px;padding:4px 8px 6px;overflow-x:auto;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
@media(min-width:900px){#tabs{padding-top:10px}}
.tab{flex:1 1 0;min-width:50px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 5px;border-radius:18px;font-size:10px;font-weight:800;color:var(--muted);position:relative;transition:background .25s,color .25s}
.tab .ic{width:20px;height:20px}
.tab.on{background:rgba(255,255,255,.8);color:var(--ink);box-shadow:var(--shadow-s)}
.tab .badge{position:absolute;top:2px;right:6px;min-width:17px;height:17px;border-radius:99px;background:var(--p1);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-weight:900}
.tab .badge.y{background:var(--p2);color:#4a3a14}
#tabBody{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 12px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(62,74,63,.25) transparent}
#panel.s0 #tabBody{display:none}

/* kort */
.card{border-radius:22px;background:rgba(255,255,255,.56);border:1px solid var(--line);padding:12px 14px;margin:0 0 10px;position:relative;overflow:hidden;box-shadow:var(--shadow-s)}
.card.fresh{animation:cardIn .5s var(--ease)}
@keyframes cardIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.card.sel{outline:3px solid rgba(123,154,121,.55)}
.card .stripe{position:absolute;left:0;top:0;bottom:0;width:6px}
.card.p1 .stripe{background:var(--p1)}.card.p2 .stripe{background:var(--p2)}.card.p3 .stripe{background:var(--p3)}.card.p4 .stripe{background:var(--p4)}
.card.late{box-shadow:0 0 0 2px rgba(217,105,90,.45),var(--shadow-s)}
.card h4{margin:0;font-size:15px;font-weight:900;line-height:1.2}
.card .addr{font-size:12.5px;color:var(--muted);font-weight:700}
.slotline{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.slot{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;background:rgba(62,74,63,.07);color:var(--ink)}
.slot.ok{background:rgba(141,181,136,.3);color:#3f6a3b}.slot.en{background:rgba(228,174,78,.28);color:#85601a}.slot.miss{background:rgba(217,105,90,.16);color:#9c3f33}.slot.opt{border:1px dashed rgba(62,74,63,.25);background:transparent;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.empty{padding:26px 12px;text-align:center;color:var(--muted);font-weight:700}
.empty .ic{width:34px;height:34px;opacity:.5;display:block;margin:0 auto 8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px}.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){font-weight:800;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border-radius:20px;background:rgba(255,255,255,.55);border:1px solid var(--line);padding:10px 12px}
.tile b{display:block;font-size:20px;font-weight:900}.tile span{font-size:11.5px;color:var(--muted);font-weight:800}
.seg{display:flex;gap:4px;padding:3px;border-radius:99px;background:rgba(255,255,255,.5);border:1px solid var(--line);margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:800;color:var(--muted);transition:background .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-s)}
.urow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:18px;background:rgba(255,255,255,.5);border:1px solid var(--line);margin-bottom:6px}
.urow.sel{outline:3px solid rgba(123,154,121,.55)}
.urow .av{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:14px}.sig i{width:3px;border-radius:2px;background:rgba(62,74,63,.2)}.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:8px}.sig i:nth-child(3){height:11px}.sig i:nth-child(4){height:14px}
.sig.bra i{background:#7B9A79}.sig.svak i:nth-child(-n+2){background:#E4AE4E}.sig.ingen i{background:rgba(62,74,63,.18)}
.shopcard{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:20px;background:rgba(255,255,255,.55);border:1px solid var(--line);margin-bottom:8px}
.shopcard .av{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none}
.shopcard.lock{opacity:.6}
.price{font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.pring{width:46px;height:46px;position:relative;flex:none}.pring svg{width:46px;height:46px;transform:rotate(-90deg)}.pring circle{fill:none;stroke-width:5;stroke-linecap:round}.pring .bg{stroke:rgba(62,74,63,.12)}
.pring b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900}
.price.bad{color:#9c3f33}
.logrow{padding:5px 2px;font-size:12.5px;border-bottom:1px solid var(--line);font-weight:700}.logrow .tm{color:var(--muted);font-size:10.5px;margin-right:6px;font-variant-numeric:tabular-nums}
.logrow.warn{color:#85601a}.logrow.alarm{color:#9c3f33;font-weight:900}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px;padding:6px 2px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.bars .col i{width:100%;max-width:26px;border-radius:9px 9px 4px 4px;background:var(--sage);min-height:3px;transition:height .5s var(--ease)}
.bars .col i.neg{background:var(--brann)}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}.bars .pair i{width:42%;max-width:15px}.bars .col small{font-size:9.5px;color:var(--muted);font-weight:800}

/* ---------- skjermer ---------- */
.screen{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto;
  background:linear-gradient(180deg,rgba(226,235,228,.45),rgba(226,235,228,.8));animation:fadeIn .6s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.screen .inner{width:min(780px,100%);margin:auto}
.logo{text-align:center;margin-bottom:18px}
.logo h1{margin:0;font-size:clamp(40px,9vw,64px);font-weight:900;letter-spacing:-.02em;color:var(--moss);line-height:1}
.logo h1 span{color:var(--brann)}
.logo p{margin:8px 0 0;color:var(--muted);font-weight:700;font-size:15px}
.citycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.ccard{border-radius:30px;padding:18px 18px 16px;text-align:left;transition:transform .3s var(--ease),box-shadow .3s}
.ccard:hover{transform:translateY(-3px)}
.ccard h2{margin:0 0 2px;font-size:26px;font-weight:900}.ccard .tag{color:var(--muted);font-weight:700;font-size:13px;margin-bottom:8px}
.ccard p{margin:8px 0;font-size:13.5px;line-height:1.45;font-weight:600}
.agcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.acard{border-radius:28px;padding:18px;text-align:left;transition:transform .3s var(--ease)}
.acard:hover{transform:translateY(-3px)}
.acard .big{width:54px;height:54px;border-radius:20px;display:grid;place-items:center;color:#fff;margin-bottom:10px}.acard .big .ic{width:28px;height:28px}
.acard h3{margin:0 0 3px;font-size:19px;font-weight:900}.acard .nr{font-weight:900;font-size:13px;opacity:.7}.acard p{margin:6px 0 0;font-size:13px;line-height:1.4}

/* ---------- dialoger ---------- */
#modalRoot{position:absolute;inset:0;z-index:60;pointer-events:none}
.mback{position:absolute;inset:0;background:rgba(58,69,59,.34);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:auto;animation:fadeIn .25s ease-out}
.modal{width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;border-radius:30px;padding:20px 20px 16px;animation:popIn .4s var(--ease);background:rgba(250,246,236,.94)}
@keyframes popIn{from{transform:translateY(16px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 8px;font-size:21px;font-weight:900}
.modal .body{font-size:14px;line-height:1.5;font-weight:600}

/* ==========================================================================
   4. BYGGENERERING – verden, vei-nett og A*-stifinning (deterministisk fra seed)
   ========================================================================== */
const SIDES = ['N', 'E', 'S', 'W'];
const SIDE_VEC = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
const BLOCK_TYPE = { '.': 'by', P: 'park', W: 'vann', S: 'strand', I: 'oy', H: 'li', F: 'fjell' };
const TS = 2;                       // terrengets rutenettsteg (verdensenheter)

function buildWorld(cfg) {
  const W = cfg.W, H = cfg.H, rnd = mulberry32(cfg.seed);
  const ri_ = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const X0 = -W * CELL / 2, Z0 = -H * CELL / 2;
  const world = { cfg, W, H, X0, Z0, X1: X0 + W * CELL, Z1: Z0 + H * CELL, TS };
  const nodeX = i => X0 + i * CELL, nodeZ = j => Z0 + j * CELL;
  const bcx = bx => X0 + (bx + 0.5) * CELL, bcz = by => Z0 + (by + 0.5) * CELL;

  /* ---- 1. kvartaler ---- */
  const blocks = [];
  for (let y = 0; y < H; y++) {
    const row = [];
    for (let x = 0; x < W; x++) {
      const ch = cfg.map[y][x];
      const t = BLOCK_TYPE[ch] || 'by';
      row.push({ x, y, ch, t, land: t !== 'vann', cx: bcx(x), cz: bcz(y), name: cfg.parkNames && cfg.parkNames[x + ',' + y] || null });
    }
    blocks.push(row);
  }
  const blk = (x, y) => (x >= 0 && y >= 0 && x < W && y < H) ? blocks[y][x] : null;
  const landB = (x, y) => { const b = blk(x, y); return !!b && b.land; };
  world.blocks = blocks; world.blk = blk;
  const dens = (bx, by) => {
    const d = cfg.downtown; const dd = Math.hypot(bx + 0.5 - d.x, by + 0.5 - d.y);
    return clamp(1 - dd / d.r, 0, 1);
  };

  /* ---- 2. terreng: landmaske og høydefelt ---- */
  const HB = (ROAD_W / 2) / CELL;
  function landAt(x, z) {
    const u = (x - X0) / CELL, v = (z - Z0) / CELL;
    if (u < 0 || v < 0 || u >= W || v >= H) return false;
    const bx = Math.floor(u), by = Math.floor(v), fu = u - bx, fv = v - by;
    if (landB(bx, by)) return true;
    const L = fu < HB, R = fu > 1 - HB, T = fv < HB, B = fv > 1 - HB;
    if ((L && landB(bx - 1, by)) || (R && landB(bx + 1, by)) || (T && landB(bx, by - 1)) || (B && landB(bx, by + 1))) return true;
    if ((L && T && landB(bx - 1, by - 1)) || (R && T && landB(bx + 1, by - 1)) || (L && B && landB(bx - 1, by + 1)) || (R && B && landB(bx + 1, by + 1))) return true;
    return false;
  }
  const hill = cfg.hill;
  function hillH(x, z) {
    if (!hill) return 0;
    const u = (x - X0) / CELL, v = (z - Z0) / CELL;
    const t = clamp((u - hill.x0) / (hill.x1 - hill.x0), 0, 1);
    if (t <= 0) return 0;
    return Math.max(0, hill.maxH * Math.pow(t, hill.pow) + (vnoise(u * 0.9, v * 0.9, 11) - 0.5) * 1.6 * t);
  }
  const gw = Math.round(W * CELL / TS) + 1, gh = Math.round(H * CELL / TS) + 1;
  const hg = new Float32Array(gw * gh), lg = new Uint8Array(gw * gh), dg = new Float32Array(gw * gh);
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
    const x = X0 + i * TS, z = Z0 + j * TS, k = j * gw + i;
    lg[k] = landAt(x, z) ? 1 : 0;
    dg[k] = lg[k] ? 0 : 1e9;
  }
  // avstand til land (chamfer) – brukes til havdybde
  for (let pass = 0; pass < 2; pass++) {
    const js = pass ? [gh - 1, -1, -1] : [0, gh, 1], is = pass ? [gw - 1, -1, -1] : [0, gw, 1];
    for (let j = js[0]; j !== js[1]; j += js[2]) for (let i = is[0]; i !== is[1]; i += is[2]) {
      const k = j * gw + i; let d = dg[k];
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        if (!di && !dj) continue;
        const ii = i + di, jj = j + dj; if (ii < 0 || jj < 0 || ii >= gw || jj >= gh) continue;
        d = Math.min(d, dg[jj * gw + ii] + (di && dj ? 1.414 : 1));
      }
      dg[k] = d;
    }
  }
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
    const k = j * gw + i, x = X0 + i * TS, z = Z0 + j * TS;
    hg[k] = lg[k] ? hillH(x, z) : -(0.7 + Math.min(dg[k] * TS * 0.17, 2.0));
  }
  function heightAt(x, z) {
    const gx = (x - X0) / TS, gz = (z - Z0) / TS;
    const i = clamp(Math.floor(gx), 0, gw - 2), j = clamp(Math.floor(gz), 0, gh - 2);
    const fx = clamp(gx - i, 0, 1), fz = clamp(gz - j, 0, 1);
    const a = hg[j * gw + i], b = hg[j * gw + i + 1], c = hg[(j + 1) * gw + i], d = hg[(j + 1) * gw + i + 1];
    return lerp(lerp(a, b, fx), lerp(c, d, fx), fz);
  }
  Object.assign(world, { landAt, heightAt, hg, lg, gw, gh, hillH,
    surfaceY: (x, z) => Math.max(heightAt(x, z), SEA + 0.02) });

  /* ---- 3. vei-nett ---- */
  const NW = W + 1, NH = H + 1, NN = NW * NH;
  const nodes = []; const nid = (i, j) => j * NW + i;
  for (let j = 0; j < NH; j++) for (let i = 0; i < NW; i++) nodes.push({ id: nid(i, j), i, j, x: nodeX(i), z: nodeZ(j), y: 0, deg: 0 });
  const edges = [], edgeMap = new Map(), adj = Array.from({ length: NN }, () => []);
  const ekey = (a, b) => a < b ? a * NN + b : b * NN + a;
  function addEdge(a, b, props) {
    const A = nodes[a], B = nodes[b];
    const e = Object.assign({ id: edges.length, a, b, kind: 'vei', len: Math.hypot(A.x - B.x, A.z - B.z), mul: 1, horiz: A.j === B.j, adjB: [] }, props);
    edges.push(e); edgeMap.set(ekey(a, b), e); adj[a].push({ to: b, edge: e }); adj[b].push({ to: a, edge: e });
    A.deg++; B.deg++; return e;
  }
  const roadBlock = b => b && b.land && b.t !== 'fjell';
  function edgeAllowed(b1, b2) {
    // ingen vei mellom badestrand og vann (sanden går helt ned til sjøen)
    if ((b1 && b1.t === 'strand' && b2 && !b2.land) || (b2 && b2.t === 'strand' && b1 && !b1.land)) return false;
    if ((b1 && b1.t === 'strand' && !b2) || (b2 && b2.t === 'strand' && !b1)) return true;
    return roadBlock(b1) || roadBlock(b2);
  }
  const edgeKind = (b1, b2) => {
    const ts = [b1, b2].filter(b => b && b.land && b.t !== 'fjell').map(b => b.t);
    return ts.length && ts.every(t => t === 'oy' || t === 'strand') ? 'sti' : 'vei';
  };
  for (let j = 0; j < NH; j++) for (let i = 0; i < W; i++) {
    const b1 = blk(i, j - 1), b2 = blk(i, j);
    if (edgeAllowed(b1, b2)) { const e = addEdge(nid(i, j), nid(i + 1, j), { kind: edgeKind(b1, b2), line: j }); e.adjB = [b1, b2]; }
  }
  for (let i = 0; i < NW; i++) for (let j = 0; j < H; j++) {
    const b1 = blk(i - 1, j), b2 = blk(i, j);
    if (edgeAllowed(b1, b2)) { const e = addEdge(nid(i, j), nid(i, j + 1), { kind: edgeKind(b1, b2), line: i }); e.adjB = [b1, b2]; }
  }
  // høyde og helling på noder/kanter
  for (const n of nodes) n.y = Math.max(0, heightAt(n.x, n.z));
  for (const e of edges) {
    const ya = nodes[e.a].y, yb = nodes[e.b].y, slope = Math.abs(ya - yb) / e.len;
    e.slope = slope;
    e.mul = (e.kind === 'sti' ? 0.8 : 1) / (1 + 1.5 * slope) * ((ya + yb) / 2 > 1.5 ? 0.88 : 1);
  }
  // ferger
  for (const f of (cfg.ferries || [])) {
    const a = nid(f.a[0], f.a[1]), b = nid(f.b[0], f.b[1]);
    if (nodes[a].deg && nodes[b].deg) { const e = addEdge(a, b, { kind: 'ferge', mul: 0.45, hold: f.hold || 1.5, ferry: true, navn: f.navn, line: -1 }); e.mul = 0.45; }
    else console.warn('Ferge mangler noder', f);
  }
  world.nodes = nodes; world.edges = edges; world.adj = adj; world.edgeMap = edgeMap; world.NN = NN; world.nid = nid;
  world.nodeX = nodeX; world.nodeZ = nodeZ;

  // sammenhengende komponenter
  const comp = new Int32Array(NN).fill(-1); let nc = 0;
  for (let s = 0; s < NN; s++) {
    if (comp[s] !== -1 || !nodes[s].deg) continue;
    const q = [s]; comp[s] = nc;
    while (q.length) { const n = q.pop(); for (const { to } of adj[n]) if (comp[to] === -1) { comp[to] = nc; q.push(to); } }
    nc++;
  }
  world.comp = comp;

  /* ---- 4. navigasjon: A* mellom «veipunkter» {a,b,t} ---- */
  const nav = makeNav(world);
  world.nav = nav;

  /* ---- 5. tomter ---- */
  const lots = [], lotById = new Map();
  const QX = [-1, 1, 1, -1], QZ = [-1, -1, 1, 1];
  function lotAccess(lot) {
    const b = blocks[lot.by][lot.bx], side = lot.side;
    let a, bb, t;
    if (side === 'N') { a = nid(lot.bx, lot.by); bb = nid(lot.bx + 1, lot.by); t = (lot.x - nodeX(lot.bx)) / CELL; }

    const name = names[edge.line] || 'Veien';
    const along = edge.horiz ? (x - X0) : (z - Z0);
    const odd = (side === 'N' || side === 'W') ? 1 : 0;
    return name + ' ' + (2 * Math.floor(along / 4.5) + 1 + (odd ? 0 : 1));
  }
  world.addrOf = addrOf;
  for (const row of blocks) for (const b of row) {
    if (!b.land) continue;
    if (b.t === 'strand') {
      const lot = { id: b.x + ',' + b.y + ',0', bx: b.x, by: b.y, q: 0, x: b.cx, z: b.cz, size: BLK, kind: 'strand', dens: dens(b.x, b.y), floors: 0, free: false };
      // vannretning og tilgangsside
      lot.water = null;
      for (const s of ['S', 'E', 'W', 'N']) { const v = SIDE_VEC[s]; const nb = blk(b.x + v[0], b.y + v[1]); if (nb && !nb.land || (!nb)) { lot.water = s; break; } }
      const prefer = { S: ['N', 'W', 'E', 'S'], N: ['S', 'W', 'E', 'N'], E: ['W', 'N', 'S', 'E'], W: ['E', 'N', 'S', 'W'] }[lot.water || 'S'];
      for (const s of prefer) { lot.side = s; const acc = lotAccess(lot); if (acc && acc.edge && acc.edge.kind !== 'ferge' && edgeMap.get(ekey(acc.a, acc.b)) && sideEdgeExists(lot, s)) { lot.rp = acc; break; } }
      if (!lot.rp) { lot.side = 'N'; lot.rp = lotAccess(lot); }
      lots.push(lot); lotById.set(lot.id, lot); continue;
    }
    const baseKind = b.t === 'park' ? 'park' : b.t === 'oy' ? 'natur' : b.t === 'fjell' ? 'fjell' : 'bygg';
    for (let q = 0; q < 4; q++) {
      const lot = { id: b.x + ',' + b.y + ',' + q, bx: b.x, by: b.y, q, x: b.cx + QX[q] * BLK / 4, z: b.cz + QZ[q] * BLK / 4, size: BLK / 2 - 0.35,
        kind: baseKind, side: SIDES[q], dens: dens(b.x, b.y), free: false, floors: 0, btype: b.t };

  }

    else if (s === 'W') { a = nid(lot.bx, lot.by); bb = nid(lot.bx, lot.by + 1); } else { a = nid(lot.bx + 1, lot.by); bb = nid(lot.bx + 1, lot.by + 1); }

  // bygg og etasjer, ledige tomter
  const built = lots.filter(l => l.kind === 'bygg');
  for (const l of built) {
    const d = l.dens;
    if (cfg.palette === 'bergen') l.floors = l.btype === 'li' ? ri_(1, 2) : (d > 0.5 ? ri_(2, 4) : ri_(2, 3));
    else l.floors = d > 0.78 ? ri_(7, 13) : d > 0.5 ? ri_(4, 8) : d > 0.25 ? ri_(3, 5) : ri_(2, 3);
    if (rnd() < lerp(0.2, 0.065, d)) l.free = true;
  }
  // sørg for jevnt fordelte ledige tomter (minst én per 4×4 kvartaler)

    const region = built.filter(l => l.bx >= bx0 && l.bx < bx0 + 4 && l.by >= by0 && l.by < by0 + 4);
    if (region.length >= 6 && region.filter(l => l.free).length < 2) {
      const cand = region.filter(l => !l.free).sort(() => rnd() - 0.5).slice(0, 2 - region.filter(l => l.free).length);
      cand.forEach(l => l.free = true);
    }
  }
  // sykehus og master (faste tomter)
  world.hospitalDefs = [];
  for (const h of (cfg.hospitals || [])) {
    const lot = lotById.get(h.bx + ',' + h.by + ',' + h.q);
    if (lot) { lot.kind = 'sykehus'; lot.free = false; lot.floors = 5; world.hospitalDefs.push({ id: h.id, navn: h.navn, lotId: lot.id }); }
  }
  world.mastDefs = [];
  for (const m of (cfg.masts || [])) {
    const lot = lotById.get(m.bx + ',' + m.by + ',' + m.q);
    if (!lot) continue;
    if (!m.ground && lot.kind === 'bygg') { lot.free = false; lot.floors = Math.max(lot.floors, cfg.palette === 'oslo' ? 6 : 3); lot.mast = m.id; }
    lot.free = false;
    world.mastDefs.push({ id: m.id, navn: m.navn, lotId: lot.id, ground: !!m.ground });
  }

  for (const row of blocks) for (const b of row) if (b.t === 'park' && !b.name) b.name = 'Parken ved ' + (cfg.streetsH[b.y] || '');
  for (const row of blocks) for (const b of row) if (b.t === 'fjell') b.name = 'Fjellsiden';
  world.freeLots = () => lots.filter(l => l.free);

  for (const l of lots) {
    if (l.kind === 'bygg' && !l.free) {
      const d = l.dens, s = l.size;
      const houses = (cfg.palette === 'bergen' || d < 0.4) && rnd() < 0.5 && l.floors <= 3 ? 2 : 1;
      const y0 = Math.min(heightAt(l.x, l.z), heightAt(l.x - s / 2, l.z - s / 2), heightAt(l.x + s / 2, l.z + s / 2)) - 0.1;
      const slopeExtra = Math.abs(heightAt(l.x - s / 2, l.z) - heightAt(l.x + s / 2, l.z)) + Math.abs(heightAt(l.x, l.z - s / 2) - heightAt(l.x, l.z + s / 2));
      for (let k = 0; k < houses; k++) {
        const alongX = rnd() < 0.5;
        let w, dd, cx = l.x, cz = l.z;
        if (houses === 2) { w = alongX ? s * 0.92 : s * 0.42; dd = alongX ? s * 0.42 : s * 0.92; if (alongX) cz += (k ? 1 : -1) * s * 0.26; else cx += (k ? 1 : -1) * s * 0.26; }

        const h = fl * 1.05 + (fl > 3 ? 0.35 : 0.2) + slopeExtra * 0.5;
        const gable = rnd() < pal.gableP * (d > 0.65 && cfg.palette !== 'bergen' ? 0.15 : 1) && fl <= 5;
        const b = { x: cx, z: cz, y0, w, d: dd, h, color: pickC(pal.body), lot: l.id, gable: false, roofColor: pickC(pal.flatRoof), floors: fl };
        if (gable) { b.gable = true; b.roofColor = pickC(pal.gableRoof); b.rh = Math.min(w, dd) * (cfg.palette === 'bergen' ? 0.5 : 0.38) + 0.3; b.ridgeX = w >= dd; }

/* ---------- initialisering ---------- */
R.init = function (container) {
  const canvas = document.createElement('canvas');
  container.appendChild(canvas);
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
  catch (e) { return false; }
  R.canvas = canvas; R.renderer = renderer; R.container = container;
  R.dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(R.dpr);
  const scene = R.scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdde6e0);
  scene.fog = new THREE.Fog(0xdde6e0, 200, 700);
  R.camera = new THREE.PerspectiveCamera(36, 1, 2, 1600);
  R.hemi = new THREE.HemisphereLight(0xfaf3e2, 0xdadcc8, 0.7);
  R.sun = new THREE.DirectionalLight(0xfff1d6, 0.7);
  R.sun.position.set(60, 90, 40);
  scene.add(R.hemi, R.sun);
  R.dyn = new THREE.Group(); scene.add(R.dyn);
  R.resize();
  window.addEventListener('resize', R.resize);
  window.addEventListener('orientationchange', () => setTimeout(R.resize, 250));
  R.initInput(canvas);
  R.ready = true;
  return true;
};
R.resize = function () {
  if (!R.renderer) return;
  const w = R.container.clientWidth || window.innerWidth, h = R.container.clientHeight || window.innerHeight;
  R.w = w; R.h = h;
  R.renderer.setSize(w, h, false);
  R.canvas.style.width = '100%'; R.canvas.style.height = '100%';
  R.camera.aspect = w / h; R.camera.updateProjectionMatrix();
  R.pointScale = (h * R.dpr) / (2 * Math.tan(R.camera.fov * Math.PI / 360));
  if (R.fxMat) R.fxMat.uniforms.uScale.value = R.pointScale;
  if (R.wxMat) R.wxMat.uniforms.uScale.value = R.pointScale;
  if (R.glowMat) R.glowMat.uniforms.uScale.value = R.pointScale;
};
R.setQuality = function (dprCap) {
  R.dpr = Math.min(window.devicePixelRatio || 1, dprCap);
  R.renderer.setPixelRatio(R.dpr); R.resize();
};

/* ---------- bygge og fjerne statisk verden ---------- */
R.clearWorld = function () {
  for (const grp of [R.worldGroup, R.dyn]) {
    if (!grp) continue;
    while (grp.children.length) {
      const c = grp.children.pop();
      c.traverse(o => { if (o.geometry && !Object.values(R.geos).includes(o.geometry)) o.geometry.dispose(); });
    }
    if (grp === R.worldGroup) R.scene.remove(grp);
  }
  R.worldGroup = null; R.views = null; R.ambient = null; R.coverMesh = null; R.fxReady = false;
  R.selRing = null; R.placeRings = null; R.pathLine = null; R.placeMode = null; R.sel = null;
};
R.setWorld = function (world) {
  R.clearWorld();
  R.world = world;
  const g = R.worldGroup = new THREE.Group(); R.scene.add(g);
  R.views = { stations: {}, masts: {}, units: {}, incidents: {}, ghosts: {}, alarms: {} };
  buildTerrain(g); buildWater(g); buildBuildings(g); buildTrees(g); buildLamps(g); buildBeaches(g);
  buildAmbient(g); buildFunicular(g); buildCoverage(g);
  R.paintGround(R.seasonIdx);
  R.applyTreeColors(R.seasonIdx);
  R.setBeachSeason(R.seasonIdx === 1);
  R.fxInit();
  R.resetCamera(true);
  R.setEnv(R.env, true);
};

/* ---------- terreng ---------- */
function buildTerrain(g) {
  const w = R.world, gw = w.gw, gh = w.gh;
  const SZ = R.gSize = 2048, span = Math.max(w.X1 - w.X0, w.Z1 - w.Z0);
  R.gScale = SZ / span;
  const cv = R.gcanvas = document.createElement('canvas'); cv.width = cv.height = SZ;
  R.gctx = cv.getContext('2d');
  const tex = R.gtex = new THREE.CanvasTexture(cv);
  tex.anisotropy = Math.min(8, R.renderer.capabilities.getMaxAnisotropy());
  tex.generateMipmaps = true; tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter;
  const pos = new Float32Array(gw * gh * 3), uv = new Float32Array(gw * gh * 2), idx = [];
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
    const k = j * gw + i, x = w.X0 + i * w.TS, z = w.Z0 + j * w.TS;
    pos[k * 3] = x; pos[k * 3 + 1] = w.hg[k]; pos[k * 3 + 2] = z;
    uv[k * 2] = (x - w.X0) * R.gScale / SZ; uv[k * 2 + 1] = 1 - (z - w.Z0) * R.gScale / SZ;
  }
  for (let j = 0; j < gh - 1; j++) for (let i = 0; i < gw - 1; i++) {
    const a = j * gw + i, b = a + 1, c = a + gw, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx); geo.computeVertexNormals();
  R.terrain = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: tex }));
  g.add(R.terrain);
  // «diorama»-sokkel rundt kartet
  const sp = [], sc2 = [], Y0 = -3.4;
  const colLand = new THREE.Color(0xcdbf9f), colSea = new THREE.Color(0x86aebb);
  function wall(ax, az, ay, bx, bz, by_) {
    const ta = Math.max(ay, SEA), tb = Math.max(by_, SEA), wet = (ay < SEA && by_ < SEA) ? 1 : 0;
    const c = wet ? colSea : colLand;
    sp.push(ax, ta, az, bx, Y0, bz, bx, tb, bz, ax, ta, az, ax, Y0, az, bx, Y0, bz);
    for (let k = 0; k < 6; k++) sc2.push(c.r, c.g, c.b);
  }
  for (let i = 0; i < gw - 1; i++) {
    const xa = w.X0 + i * w.TS, xb = xa + w.TS;
    wall(xb, w.Z0, w.hg[i + 1], xa, w.Z0, w.hg[i]);
    wall(xa, w.Z1, w.hg[(gh - 1) * gw + i], xb, w.Z1, w.hg[(gh - 1) * gw + i + 1]);
  }
  for (let j = 0; j < gh - 1; j++) {
    const za = w.Z0 + j * w.TS, zb = za + w.TS;
    wall(w.X0, za, w.hg[j * gw], w.X0, zb, w.hg[(j + 1) * gw]);
    wall(w.X1, zb, w.hg[(j + 1) * gw + gw - 1], w.X1, za, w.hg[j * gw + gw - 1]);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  sg.setAttribute('color', new THREE.Float32BufferAttribute(sc2, 3)); sg.computeVertexNormals();
  g.add(new THREE.Mesh(sg, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide })));
  // myk skygge under dioramaet
  const sh = document.createElement('canvas'); sh.width = sh.height = 128;
  const sx = sh.getContext('2d'), gr = sx.createRadialGradient(64, 64, 20, 64, 64, 64);
  gr.addColorStop(0, 'rgba(60,72,60,0.38)'); gr.addColorStop(1, 'rgba(60,72,60,0)');
  sx.fillStyle = gr; sx.fillRect(0, 0, 128, 128);
  const shm = new THREE.Mesh(new THREE.PlaneGeometry(span * 1.5, span * 1.5), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sh), transparent: true, depthWrite: false, fog: false }));
  shm.rotation.x = -Math.PI / 2; shm.position.set((w.X0 + w.X1) / 2, Y0 - 0.05, (w.Z0 + w.Z1) / 2); g.add(shm);
}

/* ---------- maling av bakketekstur (veier, kvartaler, vann, strender, tomter) ---------- */
R.paintGround = function (seasonIdx) {
  const w = R.world; if (!w || !R.gctx) return;
  const ctx = R.gctx, SZ = R.gSize, sc = R.gScale, P = GROUND_PAL[seasonIdx || 0];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.setLineDash([]);
  ctx.fillStyle = P.deep; ctx.fillRect(0, 0, SZ, SZ);
  ctx.setTransform(sc, 0, 0, sc, -w.X0 * sc, -w.Z0 * sc);
  const HW = ROAD_W / 2, rw = ROAD_W - 0.9;
  const landCells = [];
  for (const row of w.blocks) for (const b of row) if (b.land) landCells.push([w.X0 + b.x * CELL, w.Z0 + b.y * CELL]);
  // grunt vann rundt land (myk overgang)
  ctx.save();
  ctx.shadowColor = P.shallow2; ctx.shadowBlur = 80; ctx.fillStyle = P.shallow2;
  for (const c of landCells) ctx.fillRect(c[0], c[1], CELL, CELL);
  ctx.shadowColor = P.shallow; ctx.shadowBlur = 30; ctx.fillStyle = P.shallow;
  for (const c of landCells) ctx.fillRect(c[0], c[1], CELL, CELL);
  ctx.restore();
  // land: fortau-farge i hele cellen + kyststriper
  ctx.fillStyle = P.walk;
  for (const c of landCells) ctx.fillRect(c[0] - 0.02, c[1] - 0.02, CELL + 0.04, CELL + 0.04);
  for (const row of w.blocks) for (const b of row) {
    if (b.land) continue;
    const x0 = w.X0 + b.x * CELL, z0 = w.Z0 + b.y * CELL;
    const nb = (dx, dz) => w.blk(b.x + dx, b.y + dz);
    const dirs = [[0, -1, x0, z0, CELL, HW], [0, 1, x0, z0 + CELL - HW, CELL, HW], [-1, 0, x0, z0, HW, CELL], [1, 0, x0 + CELL - HW, z0, HW, CELL]];
    for (const d of dirs) {
      const n = nb(d[0], d[1]);
      if (n && n.land) { ctx.fillStyle = n.t === 'strand' ? P.sand : P.walk; ctx.fillRect(d[2] - 0.02, d[3] - 0.02, d[4] + 0.04, d[5] + 0.04); }
    }
    const corners = [[-1, -1, x0, z0], [1, -1, x0 + CELL - HW, z0], [-1, 1, x0, z0 + CELL - HW], [1, 1, x0 + CELL - HW, z0 + CELL - HW]];
    for (const c of corners) { const n = nb(c[0], c[1]); if (n && n.land) { ctx.fillStyle = P.walk; ctx.fillRect(c[2], c[3], HW, HW); } }
  }
  // skumkant langs kysten
  ctx.strokeStyle = 'rgba(255,255,255,0.72)'; ctx.lineWidth = 0.34; ctx.lineCap = 'round';
  for (const row of w.blocks) for (const b of row) {
    if (b.land) continue;
    const x0 = w.X0 + b.x * CELL, z0 = w.Z0 + b.y * CELL;
    const L = [[0, -1, x0, z0 + HW, x0 + CELL, z0 + HW], [0, 1, x0, z0 + CELL - HW, x0 + CELL, z0 + CELL - HW], [-1, 0, x0 + HW, z0, x0 + HW, z0 + CELL], [1, 0, x0 + CELL - HW, z0, x0 + CELL - HW, z0 + CELL]];
    for (const l of L) { const n = w.blk(b.x + l[0], b.y + l[1]); if (n && n.land) { ctx.beginPath(); ctx.moveTo(l[2], l[3]); ctx.lineTo(l[4], l[5]); ctx.stroke(); } }
  }
  // kvartaler
  const cfg = w.cfg;
  for (const row of w.blocks) for (const b of row) {
    if (!b.land) continue;
    const dn = clamp(1 - Math.hypot(b.x + 0.5 - cfg.downtown.x, b.y + 0.5 - cfg.downtown.y) / cfg.downtown.r, 0, 1);
    let col;
    switch (b.t) {
      case 'by': col = hexMix(P.city, P.grass, clamp(0.5 - dn * 0.6, 0, 0.5)); break;
      case 'li': col = hexMix(P.hill, P.grass, 0.25); break;
      case 'park': col = P.grass; break; case 'oy': col = P.grass2; break; case 'fjell': col = P.forest; break; default: col = P.sand;
    }
    const x0 = b.cx - BLK / 2, z0 = b.cz - BLK / 2;
    ctx.fillStyle = col; ctx.fillRect(x0, z0, BLK, BLK);
    if (b.t === 'fjell') { // bergarter og stier
      for (let k = 0; k < 7; k++) { ctx.fillStyle = k % 2 ? 'rgba(120,130,110,0.14)' : 'rgba(255,255,255,0.1)'; ctx.beginPath(); ctx.ellipse(x0 + hash2(b.x, b.y, k) * BLK, z0 + hash2(b.y, b.x, k + 9) * BLK, 1.6 + k * 0.2, 1.1, hash2(k, b.x, 3) * 3, 0, TAU); ctx.fill(); }
    }
    if (b.t === 'park' || b.t === 'oy') {
      for (let k = 0; k < 6; k++) { ctx.fillStyle = 'rgba(70,110,60,0.13)'; ctx.beginPath(); ctx.ellipse(x0 + hash2(b.x, b.y, k) * BLK, z0 + hash2(b.y, b.x, k + 4) * BLK, 1.4 + hash2(k, k, b.x) * 1.6, 1 + hash2(k, b.y, 2), hash2(k, b.x, 5) * 3, 0, TAU); ctx.fill(); }
      if (b.t === 'park') {
        ctx.strokeStyle = P.path; ctx.lineWidth = 0.7; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x0, z0 + BLK * (0.3 + 0.4 * hash2(b.x, b.y, 1))); ctx.bezierCurveTo(x0 + BLK * 0.35, z0 + BLK * 0.1, x0 + BLK * 0.65, z0 + BLK * 0.9, x0 + BLK, z0 + BLK * (0.3 + 0.4 * hash2(b.y, b.x, 2))); ctx.stroke();
        if (hash2(b.x, b.y, 7) < 0.5) { ctx.fillStyle = hexMix(P.shallow, P.deep, 0.3); ctx.beginPath(); ctx.ellipse(b.cx + 1.5, b.cz - 1.2, 1.9, 1.3, 0.4, 0, TAU); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 0.15; ctx.stroke(); }
      }
    }
    if (b.t === 'strand') { // sand ut mot sjøen med våt kant
      const lot = w.lotById.get(b.x + ',' + b.y + ',0'), wv = SIDE_VEC[lot.water || 'S'];
      ctx.fillStyle = P.sand; ctx.fillRect(x0, z0, BLK, BLK);
      const ex = b.cx + wv[0] * (BLK / 2 + HW), ez = b.cz + wv[1] * (BLK / 2 + HW);
      const gx0 = b.cx + wv[0] * (BLK / 2 - 2.2), gz0 = b.cz + wv[1] * (BLK / 2 - 2.2);
      const grd = ctx.createLinearGradient(gx0, gz0, ex, ez); grd.addColorStop(0, 'rgba(176,150,100,0)'); grd.addColorStop(1, 'rgba(176,150,100,0.5)');
      ctx.fillStyle = grd; ctx.fillRect(b.cx - CELL / 2 + 0.3, b.cz - CELL / 2 + 0.3, CELL - 0.6, CELL - 0.6);
    }
  }
  // veier
  ctx.lineCap = 'butt';
  for (const e of w.edges) {
    if (e.ferry) continue;
    const A = w.nodes[e.a], B = w.nodes[e.b];
    ctx.strokeStyle = e.kind === 'sti' ? P.path : P.road; ctx.lineWidth = e.kind === 'sti' ? 1.15 : rw;
    ctx.beginPath(); ctx.moveTo(A.x, A.z); ctx.lineTo(B.x, B.z); ctx.stroke();
  }
  for (const n of w.nodes) {
    if (!n.deg) continue;
    const hasRoad = w.adj[n.id].some(a => a.edge.kind === 'vei');
    if (hasRoad) { ctx.fillStyle = P.road; ctx.fillRect(n.x - rw / 2, n.z - rw / 2, rw, rw); }
    else { ctx.fillStyle = P.path; ctx.beginPath(); ctx.arc(n.x, n.z, 0.6, 0, TAU); ctx.fill(); }
  }
  // oppmerking og gangfelt
  ctx.strokeStyle = P.mark; ctx.lineWidth = 0.13; ctx.setLineDash([0.85, 1.05]);
  for (const e of w.edges) {
    if (e.kind !== 'vei') continue;
    const A = w.nodes[e.a], B = w.nodes[e.b], dx = (B.x - A.x) / e.len, dz = (B.z - A.z) / e.len, m = rw / 2 + 0.7;
    ctx.beginPath(); ctx.moveTo(A.x + dx * m, A.z + dz * m); ctx.lineTo(B.x - dx * m, B.z - dz * m); ctx.stroke();
  }
  ctx.setLineDash([]); ctx.fillStyle = P.mark;
  for (const n of w.nodes) {
    if (n.deg < 3) continue;
    if (Math.hypot(n.i - cfg.downtown.x, n.j - cfg.downtown.y) > cfg.downtown.r + 1) continue;
    for (const a of w.adj[n.id]) {
      if (a.edge.kind !== 'vei') continue;
      const o = w.nodes[a.to], dx = (o.x - n.x) / a.edge.len, dz = (o.z - n.z) / a.edge.len, d = rw / 2 + 0.55;
      for (let k = -2; k <= 2; k++) { const px = n.x + dx * d - dz * k * 0.5, pz = n.z + dz * d + dx * k * 0.5; ctx.fillRect(px - (dx ? 0.2 : 0.07), pz - (dz ? 0.2 : 0.07), dx ? 0.4 : 0.14, dz ? 0.4 : 0.14); }
    }
  }
  // fergeruter
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 0.22; ctx.setLineDash([1.1, 1.1]);
  for (const e of w.edges) if (e.ferry) { const A = w.nodes[e.a], B = w.nodes[e.b]; ctx.beginPath(); ctx.moveTo(A.x, A.z); ctx.lineTo(B.x, B.z); ctx.stroke(); }
  ctx.setLineDash([]);
  // skygger under bygg og trær
  ctx.save();
  ctx.shadowColor = seasonIdx === 3 ? 'rgba(60,75,85,0.34)' : 'rgba(45,58,45,0.34)'; ctx.shadowBlur = 9;
  for (const b of w.buildings) {
    const o = Math.min(14, 2.2 + b.h * 0.85);
    ctx.shadowOffsetX = o; ctx.shadowOffsetY = o * 1.1;
    const lot = w.lotById.get(b.lot), bl = w.blocks[lot.by][lot.bx];
    ctx.fillStyle = bl.t === 'li' ? hexMix(P.hill, P.grass, 0.25) : hexMix(P.city, P.grass, clamp(0.5 - lot.dens * 0.6, 0, 0.5));
    ctx.fillRect(b.x - b.w / 2, b.z - b.d / 2, b.w, b.d);
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(40,62,40,0.2)';
  for (const t of w.trees) { ctx.beginPath(); ctx.ellipse(t.x + 0.35, t.z + 0.4, 0.95 * t.s, 0.8 * t.s, 0, 0, TAU); ctx.fill(); }
  // ledige tomter
  for (const l of w.lots) {
    if (!l.free) continue;
    const s = l.size - 0.2;
    ctx.fillStyle = P.tomt; ctx.fillRect(l.x - s / 2, l.z - s / 2, s, s);
    ctx.strokeStyle = 'rgba(120,108,80,0.55)'; ctx.lineWidth = 0.14; ctx.setLineDash([0.5, 0.35]); ctx.strokeRect(l.x - s / 2 + 0.2, l.z - s / 2 + 0.2, s - 0.4, s - 0.4); ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(120,108,80,0.28)'; ctx.lineWidth = 0.12;
    ctx.beginPath(); ctx.moveTo(l.x - 0.9, l.z - 0.9); ctx.lineTo(l.x + 0.9, l.z + 0.9); ctx.moveTo(l.x + 0.9, l.z - 0.9); ctx.lineTo(l.x - 0.9, l.z + 0.9); ctx.stroke();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  R.gtex.needsUpdate = true;
  R.seasonIdx = seasonIdx || 0;
};

/* ---------- vann ---------- */
function buildWater(g) {
  const w = R.world, sx = w.X1 - w.X0, sz = w.Z1 - w.Z0;
  const water = new THREE.Mesh(new THREE.PlaneGeometry(sx, sz), new THREE.MeshLambertMaterial({ color: 0x6F9DB0, transparent: true, opacity: 0.62, depthWrite: false }));
  water.rotation.x = -Math.PI / 2; water.position.set((w.X0 + w.X1) / 2, SEA, (w.Z0 + w.Z1) / 2); water.renderOrder = 1;
  g.add(water); R.water = water;
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'); x.lineCap = 'round';
  for (let k = 0; k < 90; k++) {
    const px = Math.random() * 256, py = Math.random() * 256, l = 8 + Math.random() * 18;
    x.strokeStyle = 'rgba(255,255,255,' + (0.1 + Math.random() * 0.22) + ')'; x.lineWidth = 1.6;
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + l / 2, py - 3, px + l, py); x.stroke();
    x.beginPath(); x.moveTo(px - 256, py); x.quadraticCurveTo(px - 256 + l / 2, py - 3, px - 256 + l, py); x.stroke();
  }
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(sx / 36, sz / 36);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(sx, sz), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.55, depthWrite: false, fog: false }));
  sh.rotation.x = -Math.PI / 2; sh.position.set((w.X0 + w.X1) / 2, SEA + 0.03, (w.Z0 + w.Z1) / 2); sh.renderOrder = 2;
  g.add(sh); R.shimmer = sh;
}

/* ---------- bygninger (instansiert) ---------- */
function makeBuildingMat() {
  const m = new THREE.MeshLambertMaterial({ color: 0xffffff });
  m.userData.u = { uNight: { value: 0 } };
  m.onBeforeCompile = sh => {
    sh.uniforms.uNight = m.userData.u.uNight;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP;\nvarying vec3 vWN;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n'
        + 'vec4 wp_ = vec4(transformed, 1.0); vec3 wn_ = objectNormal;\n'
        + '#ifdef USE_INSTANCING\n wp_ = instanceMatrix * wp_; wn_ = mat3(instanceMatrix) * wn_;\n#endif\n'
        + 'wp_ = modelMatrix * wp_; vWP = wp_.xyz; vWN = normalize(mat3(modelMatrix) * wn_);');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uNight; varying vec3 vWP; varying vec3 vWN;\n'
        + 'float h21(vec2 p){ p = fract(p * vec2(233.34, 851.73)); p += dot(p, p + 23.45); return fract(p.x * p.y); }')
      .replace('#include <color_fragment>', '#include <color_fragment>\n'
        + 'float vert_ = 1.0 - step(0.5, abs(vWN.y));\n'
        + 'float uw_ = abs(vWN.x) > 0.5 ? vWP.z : vWP.x;\n'
        + 'vec2 cell_ = vec2(uw_ / 1.15, (vWP.y - 0.1) / 1.05); vec2 f_ = fract(cell_); vec2 id_ = floor(cell_);\n'
        + 'float win_ = step(0.2, f_.x) * step(f_.x, 0.8) * step(0.26, f_.y) * step(f_.y, 0.78) * step(0.85, vWP.y) * vert_;\n'
        + 'diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.40, 0.53, 0.60), win_ * 0.55);\n'

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

/** signalFn(x,z) -> 0..1. Fargelegger terrenget etter dekning. */
R.updateCoverage = function (signalFn) {

    if (s >= 0.26) { r = 0.62; g = 0.55; b = 0.82; a = 0.24 + 0.1 * Math.min(1, (s - 0.26) / 0.5); }
    else if (s >= 0.07) { r = 0.82; g = 0.78; b = 0.90; a = 0.2; }
    else { r = 0.45; g = 0.46; b = 0.52; a = w.lg[k] ? 0.15 : 0.05; }
    col.setXYZW(k, r, g, b, a);

  col.needsUpdate = true;
};

/* ---------- kamera og inndata (mus, touch, tastatur) ---------- */
R.resetCamera = function (instant) {

  c.gdist = Math.max(w.X1 - w.X0, w.Z1 - w.Z0) * 0.92;
  if (instant) { c.tx = c.gtx; c.tz = c.gtz; c.yaw = c.gyaw; c.pitch = c.gpitch; c.dist = c.gdist; }
};
R.applyCamera = function () {

};
R.updateCamera = function (dt) {

/* ---------- plukking (skjermavstand – god for fingre) ---------- */
R.pickList = function (S) {

    if (R.placeMode.lots) for (const l of R.placeMode.lots) out.push({ type: 'lot', id: l.id, x: l.x, y: Math.max(w.heightAt(l.x, l.z), 0) + 0.5, z: l.z, wt: 1 });

  }
  for (const id in S.incidents) { const i = S.incidents[id]; if (i.state === 'ferdig' || i.state === 'feilet') continue; out.push({ type: 'incident', id, x: i.loc.x, y: R.views.incidents[id] ? R.views.incidents[id].y + 6 : 5, z: i.loc.z, wt: 0.7 }); }
  for (const id in S.units) { const u = S.units[id]; if (u.vis === false) continue; const p = u.contact === 'ingen' && u.lastKnown ? u.lastKnown : u; out.push({ type: 'unit', id, x: p.x, y: R.world.surfaceY(p.x, p.z) + 1, z: p.z, wt: 1 }); }

R.pick = function (px, py, touch, S) {

/* ---------- logg (samband-logg i Nødnett-stil) ---------- */

/* ---------- klokke, årstider og vær ---------- */
const Clock = {

  label() { const c = this.cur || this.info(); return SEASONS[c.season].navn + ' · dag ' + c.dayNo; },

  if (changed && S.t > 0) Bus.emit('toast', { msg: 'Været endrer seg: ' + WEATHER[kind].navn.toLowerCase(), kind: 'info' });
}

  const sm = tpl.season && tpl.season[info.sid]; if (sm !== undefined) m *= sm;
  const tm = tpl.tod && tpl.tod[Clock.tod(info.hour)]; if (tm !== undefined) m *= tm;

/* ==========================================================================
   7. NØDNETT – basestasjoner (master), dekning, kapasitet, talegrupper, nødknapp og utfall
   ========================================================================== */
const TG_NAMES = { BRANN: 'Brann', POLITI: 'Politi', HELSE: 'Helse', REDNING: 'Frivillige / Redning' };

function tgOf(u) {

const Net = {
  dirty: true,
  /** Oppretter faste master fra byconfig. */

      S.net.masts[m.id] = this.make({ id: m.id, navn: m.navn, lot, ground: m.ground });
      S.occ[lot.id] = S.occ[lot.id] || 'mast';
    }
  },
  make(o) {

  },
  weakMul(x, z) {

    // nødknapp-frister
    for (const al of S.net.alarms) if (!al.done && S.t >= al.deadline) Sim.alarmFail(al);
    if (S.net.alarms.length > 30) S.net.alarms = S.net.alarms.filter(a => !a.done || S.t - a.t0 < 40);
  },
  outage(m, cause) {
    m.down = true; m.repairAt = S.t + rr(14, 26); this.dirty = true;
    Log.add('NØDNETT', 'Driftssentral', 'Basestasjon ' + m.navn + ' er utfallen (' + cause + ') – området mister dekning', 'alarm');
    Bus.emit('toast', { msg: 'Utfall: basestasjon ' + m.navn + ' er nede – ' + cause, kind: 'bad' });
  },
  fastRepair(m) {
    const cost = 12000; if (!m.down || S.money < cost) return false;
    S.money -= cost; S.stats.costs += cost; m.repairAt = S.t + (m.repairAt - S.t) * 0.35; return true;
  },
  status() {
    const ms = Object.values(S.net.masts), down = ms.filter(m => m.down).length, maxLoad = Math.max(0, ...ms.map(m => m.load));
    const lost = Object.values(S.units).filter(u => u.vis !== false && u.contact === 'ingen' && u.status !== 'ledig').length;

  coverage() {  // andel av landarealet med god dekning

    for (let j = 0; j < w.gh; j += 2) for (let i = 0; i < w.gw; i += 2) {
      const k = j * w.gw + i; if (!w.lg[k]) continue; tot++;
      if (this.quality(this.signalAt(w.X0 + i * w.TS, w.Z0 + j * w.TS)) !== 'ingen') ok++;

  },
  addMast(lotId) {
    const lot = WORLD.lotById.get(lotId), id = 'm' + (S.nid++);
    S.net.masts[id] = this.make({ id, navn: 'Ny mast ' + (Object.keys(S.net.masts).length + 1), lot, ground: lot.kind !== 'bygg' });
    S.net.masts[id].navn = (lot.addr || 'Ny mast').replace(/ \d+$/, '');
    S.occ[lotId] = 'mast'; this.dirty = true; return id;
  },
  deployMobile(x, z) {
    const id = 'mm' + (S.nid++);
    S.net.masts[id] = { id, navn: 'Mobil basestasjon', x, z, lotId: null, baseY: Math.max(0, WORLD.heightAt(x, z)), radius: 3.8 * CELL, cap: 4, level: 0, down: false, repairAt: 0, mobile: true, load: 0, calls: 0 };
    S.net.mobile--; this.dirty = true; return id;
  },
  recall(id) { const m = S.net.masts[id]; if (!m || !m.mobile) return; delete S.net.masts[id]; S.net.mobile++; this.dirty = true; },
  upgrade(id) { const m = S.net.masts[id]; if (!m || m.level >= 3) return false; m.level++; m.cap += 4; return true; },
  /** Nødknapp: mannskaper i fare utløser alarm med høyeste prioritet. */
  triggerAlarm(u, inc) {
    const al = { id: S.nid++, unitId: u.id, incId: inc.id, t0: S.t, deadline: S.t + 9, done: false, ok: false, helpers: [] };
    S.net.alarms.push(al);
    Log.add(tgOf(u), u.name, 'NØDKNAPP! Mannskap i fare ved ' + inc.loc.addr, 'alarm');
    Bus.emit('alarm', al); Bus.emit('toast', { msg: 'NØDKNAPP: ' + u.name + ' trenger hjelp!', kind: 'bad' });
    return al;
  }
};

/* ==========================================================================
   8. ENHETER OG STASJONER
   Status: Ledig → Utrykning → På stedet → Transport / Arrest → Retur → Ledig
   Frivillige: Varslet → Mobiliserer → Utrykning → På stedet → Retur
   ========================================================================== */
const Sim = {};
const STATUS_NAVN = { ledig: 'Ledig', varslet: 'Varslet', mobiliserer: 'Mobiliserer', utrykning: 'Utrykning', pastedet: 'På stedet', transport: 'Transport', arrest: 'Arrest', retur: 'Retur', ute: 'Utilgjengelig' };
const isFree = lot => !!lot && lot.free && !S.occ[lot.id];

function dayStat(k, v) { const d = Clock.cur ? Clock.cur.dayNo : 1; const o = S.stats.days[d] || (S.stats.days[d] = { inc: 0, ok: 0, fail: 0, income: 0, cost: 0 }); o[k] += v; }
const isSummer = () => Clock.cur && Clock.cur.season === 1;
const ok_ = msg => ({ ok: true, msg }), fail_ = msg => ({ ok: false, msg });

Sim.freeLots = () => WORLD.lots.filter(isFree);
Sim.mastLots = () => WORLD.lots.filter(l => !S.occ[l.id] && (l.free || l.kind === 'park' || l.kind === 'natur' || l.kind === 'fjell'));
Sim.stationList = org => Object.values(S.stations).filter(s => ST[s.type].org === org && (ST[s.type].rolle === 'etat' || ST[s.type].rolle === 'frivillig'));
Sim.stationCap = st => ST[st.type].cap + 2 * st.up.garasje;
Sim.unitsAt = id => Object.values(S.units).filter(u => u.stationId === id);
Sim.stationLot = st => WORLD.lotById.get(st.lotId);

Sim.buildStation = function (type, lotId, opts) {
  opts = opts || {};
  const T = ST[type], lot = WORLD.lotById.get(lotId);
  if (!lot || (!opts.force && !isFree(lot))) return fail_('Tomten er ikke ledig.');
  if (!opts.free) {
    if (S.level < T.lvl) return fail_('Krever nivå ' + T.lvl + '.');
    if (['brann', 'politi', 'ambulanse'].includes(T.org) && T.rolle !== 'helse' && !S.agencies[T.org]) return fail_('Du har ikke ' + AGENCIES[T.org].kort.toLowerCase() + 'etaten ennå.');
    if ((type === 'rk_base' && !S.vol.rk) || (type === 'nf_base' && !S.vol.nf)) return fail_('Krever samarbeidsavtale.');
    if ((T.rolle === 'helse' || type === 'helikopterbase') && !S.agencies.ambulanse) return fail_('Krever ambulanseetaten.');
    if (type === 'arrest' && !S.agencies.politi) return fail_('Krever politietaten.');
    if (!spend(T.cost)) return fail_('Du har ikke nok penger.');
  }
  const id = 's' + S.nid++, count = Object.values(S.stations).filter(s => s.type === type).length + 1;
  const st = { id, type, lotId, no: count, name: opts.name || (T.navn + ' ' + count), up: { garasje: 0, mannskap: 0 }, t: S.t };
  if (opts.free && T.rolle === 'helse') st.gift = true;
  S.stations[id] = st; S.occ[lotId] = id;
  Bus.emit('built', st);
  return { ok: true, msg: T.navn + ' er bygget.', st };
};
Sim.parkPos = function (st, k) {
  const lot = WORLD.lotById.get(st.lotId), nav = WORLD.nav;
  if (st.type === 'helikopterbase') return { x: lot.x - 0.2, z: lot.z + 0.4, h: 0 };
  const rp = lot.rp, P = nav.rpXZ(rp), e = nav.edgeOf(rp.a, rp.b), A = WORLD.nodes[e.a], B = WORLD.nodes[e.b];
  const dx = (B.x - A.x) / e.len, dz = (B.z - A.z) / e.len, sv = SIDE_VEC[lot.side], off = (k - 1) * 2.7;
  return { x: P.x + dx * off - sv[0] * 0.7, z: P.z + dz * off - sv[1] * 0.7, h: Math.atan2(dx, dz) + (k % 2 ? Math.PI : 0) };
};
Sim.canHouse = (type, st) => {
  const T = UT[type], S_ = ST[st.type];
  if (T.org === 'ambulanse') return type === 'luftambulanse' ? st.type === 'helikopterbase' : st.type === 'ambulansestasjon';
  return S_.org === T.org && (S_.rolle === 'etat' || S_.rolle === 'frivillig') && st.type !== 'helikopterbase';
};
Sim.addUnit = function (type, stationId, opts) {
  opts = opts || {};
  const T = UT[type], st = S.stations[stationId], id = 'u' + S.nid++;
  const seq = Object.values(S.units).filter(u => u.stationId === stationId).length + 1;
  const park = Sim.parkPos(st, seq - 1);
  const u = { id, type, org: T.org, stationId, name: CALL[type] + ' ' + st.no + '-' + seq, status: 'ledig', x: park.x, z: park.z, h: park.h, path: [], pi: 0, job: null, wait: 0, contact: 'bra', lastKnown: { x: park.x, z: park.z }, vis: true, sig: 1, siren: false, alt: 0 };
  if (st.type === 'helikopterbase') u.alt = 0.3;
  S.units[id] = u; Bus.emit('unitAdded', u); return u;
};
Sim.buyUnit = function (type, stationId) {
  const T = UT[type], st = S.stations[stationId];
  if (!st) return fail_('Velg en stasjon.');
  if (S.level < T.lvl) return fail_('Krever nivå ' + T.lvl + '.');
  if (!Sim.canHouse(type, st)) return fail_('Denne stasjonen kan ikke huse ' + T.navn.toLowerCase() + '.');
  if (T.org in S.vol && !S.vol[T.org]) return fail_('Krever samarbeidsavtale.');
  if (Sim.unitsAt(stationId).length >= Sim.stationCap(st)) return fail_('Stasjonen er full – utvid garasjen eller bygg ny stasjon.');
  if (!spend(T.cost)) return fail_('Du har ikke nok penger.');
  const u = Sim.addUnit(type, stationId);
  Log.add((AGENCIES[T.org] || AGENCIES.brann).tg, 'Sentral', u.name + ' er klar med Nødnett-terminal og meldt ledig', 'info');
  return { ok: true, msg: u.name + ' er kjøpt.', u };
};
Sim.callsign = u => u.name;

/* ---------- bevegelse og statusmaskin ---------- */
Sim.unitRP = function (u) {
  if (u.status === 'ledig' && u.stationId && S.stations[u.stationId]) return WORLD.lotById.get(S.stations[u.stationId].lotId).rp;
  const r = WORLD.nav.nearestRP(u.x, u.z); return { a: r.a, b: r.b, t: r.t };
};
Sim.turnoutOf = u => { const T = UT[u.type]; return (T.turnout || 0) * (1 - 0.15 * (S.up[T.org] || 0)); };
Sim.speedOf = function (u) {
  const T = UT[u.type], c = Clock.cur;
  let sp = BASE_SPEED * T.spd * (1 + 0.08 * (S.up[T.org] || 0));
  if (u.bistand) sp *= 0.85;
  sp *= SEASONS[c.season].speed * WEATHER[S.weather.kind].spd;
  const tod = Clock.tod(c.hour); sp *= tod === 'rush' ? 0.92 : tod === 'natt' ? 1.06 : 1;
  if (u.siren) sp *= 1.12;
  return sp;
};
Sim.opDelay = function (ag) {
  const a = S.ops[ag] ? ag : 'politi';
  const active = Object.values(S.incidents).filter(i => i.lead === a).length;
  return 0.2 + Math.min(4, Math.max(0, active - 3 * S.ops[a]) * 0.5);
};
Sim.moveUnit = function (u, dt) {
  if (u.hold > 0) { u.hold -= dt; return false; }
  const sp = Sim.speedOf(u); let left = dt;
  while (left > 1e-6 && u.pi < u.path.length) {
    const p = u.path[u.pi];
    if (p.f && u.boarded !== u.pi) { u.boarded = u.pi; if (p.hold) { u.hold = p.hold; u.onFerry = false; return false; } }
    u.onFerry = !!p.f;
    const dx = p.x - u.x, dz = p.z - u.z, d = Math.hypot(dx, dz), v = sp * (p.m || 1);
    if (d < 1e-4) { u.pi++; continue; }
    if (d / v <= left) { u.x = p.x; u.z = p.z; left -= d / v; u.h = Math.atan2(dx, dz); u.pi++; }
    else { u.x += dx / d * v * left; u.z += dz / d * v * left; u.h = Math.atan2(dx, dz); left = 0; }
  }
  if (UT[u.type].model === 'heli' && u.path.length) { // stige og lande
    const last = u.path[u.path.length - 1], dEnd = Math.hypot(last.x - u.x, last.z - u.z);
    u.alt = clamp(Math.min(u.flown || 0, dEnd) * 0.6, 0.3, 9); u.flown = (u.flown || 0) + sp * dt;
  }
  if (u.pi >= u.path.length) { u.onFerry = false; return true; }
  return false;
};
Sim.updateUnit = function (u, dt) {
  const T = UT[u.type];
  switch (u.status) {
    case 'ledig': case 'pastedet': return;
    case 'varslet':
      u.wait -= dt;
      if (u.wait <= 0) { u.status = 'mobiliserer'; u.wait = Vol.mobTime(u); Log.add(tgOf(u), u.name, 'Mottatt – mobiliserer mannskap', 'info'); }
      return;
    case 'mobiliserer': u.wait -= dt; if (u.wait <= 0) Sim.startDrive(u); return;
    case 'ute': u.wait -= dt; if (u.wait <= 0) Sim.recover(u); return;
  }
  switch (u.phase) {
    case 'await': u.wait -= dt; if (u.wait <= 0) Sim.startDrive(u); break;
    case 'walk': u.wait -= dt; if (u.wait <= 0) { const inc = S.incidents[u.job && u.job.inc]; if (inc) Sim.arrive(u, inc); else Sim.sendHome(u); } break;
    case 'handover': u.wait -= dt; if (u.wait <= 0) { Log.add(tgOf(u), u.name, u.status === 'arrest' ? 'Overlevert – ferdig, returnerer' : 'Pasient overlevert, returnerer', 'info'); Sim.sendHome(u); } break;
    case 'drive': if (Sim.moveUnit(u, dt)) Sim.onPathEnd(u); break;
  }
};
/** Setter en enhet i gang mot hendelsen: stifinning med A* langs veinettet. */
Sim.startDrive = function (u) {
  const inc = S.incidents[u.job && u.job.inc];
  if (!u.job || (u.job.inc && !inc)) { Sim.sendHome(u); return; }
  if (u.job.guard) return Sim.driveToGuard(u);
  const T = UT[u.type];
  u.status = 'utrykning'; u.phase = 'drive'; u.dest = 'inc'; u.siren = !T.foot; u.boarded = -1; u.flown = 0; u.walked = false;
  if (T.model === 'heli') {
    const lz = Sim.landingFor(inc); if (!lz) { Log.add(tgOf(u), u.name, 'Ingen egnet landingsplass – avbryter', 'warn'); Sim.detach(u); Sim.sendHome(u); return; }
    u.path = [{ x: lz.x, z: lz.z, m: 1 }]; u.pi = 0; u.alt = 0.5; return;
  }
  if (T.foot) { u.path = [{ x: inc.loc.x, z: inc.loc.z, m: 1 }]; u.pi = 0; return; }
  const r = WORLD.nav.route(Sim.unitRP(u), inc.loc.rp);
  if (!r.ok) { Log.add(tgOf(u), u.name, 'Finner ingen vei til stedet – avbryter', 'warn'); Sim.detach(u); Sim.sendHome(u); return; }
  u.path = r.pts; u.pi = 0;
};
Sim.sendHome = function (u) {
  const T = UT[u.type]; u.siren = false; u.job = null; u.onFerry = false;
  u.status = 'retur'; u.phase = 'drive'; u.dest = 'home'; u.boarded = -1; u.flown = 0;
  if (u.bistand) {
    const port = u.port; u.path = [{ x: port.x, z: port.z, m: 1 }]; u.dest = 'port';
    const r = WORLD.nav.route(Sim.unitRP(u), { a: port.id, b: port.id, t: 0 }); if (r.ok) u.path = r.pts; u.pi = 0; return;
  }
  const st = S.stations[u.stationId];
  if (T.foot) { const b = WORLD.beaches[u.beach]; u.path = [{ x: b.tower.x, z: b.tower.z, m: 1 }]; u.pi = 0; return; }
  if (T.model === 'heli') { const p = Sim.parkPos(st, 0); u.path = [{ x: p.x, z: p.z, m: 1 }]; u.pi = 0; return; }
  const r = WORLD.nav.route(Sim.unitRP(u), WORLD.lotById.get(st.lotId).rp);
  if (!r.ok) { const p = Sim.parkPos(st, 0); u.x = p.x; u.z = p.z; u.path = []; Sim.park(u); return; }
  u.path = r.pts; u.pi = 0;
};
Sim.park = function (u) {
  const st = S.stations[u.stationId], T = UT[u.type];
  u.status = 'ledig'; u.phase = null; u.job = null; u.path = []; u.pi = 0; u.siren = false; u.dest = null; u.onFerry = false;
  if (T.foot) { const b = WORLD.beaches[u.beach]; u.x = b.tower.x; u.z = b.tower.z; u.h = 0; return; }
  const k = Sim.unitsAt(u.stationId).sort((a, b) => a.id.localeCompare(b.id)).findIndex(x => x.id === u.id);
  const p = Sim.parkPos(st, Math.max(0, k)); u.x = p.x; u.z = p.z; u.h = p.h; u.alt = st.type === 'helikopterbase' ? 0.3 : 0;
};
Sim.recover = function (u) { u.vis = true; Sim.park(u); Log.add(tgOf(u), u.name, 'Mannskapet er tilbake i tjeneste', 'info'); };
Sim.detach = function (u) {
  const inc = u.job && u.job.inc && S.incidents[u.job.inc];
  if (inc) for (const s of inc.slots) { const i = s.units.indexOf(u.id); if (i >= 0) s.units.splice(i, 1); }
  u.job = null;
};
Sim.recall = function (u) {
  if (!u.job) return;
  Log.add(tgOf(u), 'Sentral', u.name + ' kalles tilbake', 'info');
  Sim.detach(u); if (u.status === 'pastedet' || u.status === 'utrykning' || u.status === 'varslet' || u.status === 'mobiliserer') Sim.sendHome(u);
};
Sim.onPathEnd = function (u) {
  const T = UT[u.type];
  switch (u.dest) {
    case 'inc': {
      const inc = S.incidents[u.job && u.job.inc];
      if (!inc) return Sim.sendHome(u);
      const ap = (inc.approach || 0) * (T.offroad ? 0.5 : 1) * (T.foot || T.model === 'heli' ? 0 : 1);
      if (ap > 0 && !u.walked) { u.walked = true; u.phase = 'walk'; u.wait = ap; u.siren = false; Log.add(tgOf(u), u.name, 'Fremme ved utgangspunkt – går inn i terrenget', 'info'); return; }
      Sim.arrive(u, inc); return; }
    case 'hosp': u.phase = 'handover'; u.wait = 3; u.siren = false; return;
    case 'arrest': u.phase = 'handover'; u.wait = u.arrestMin || 6; return;
    case 'guard': u.status = 'pastedet'; u.phase = null; u.siren = false; Log.add(tgOf(u), u.name, 'Sanitetsvakt etablert', 'info'); return;
    case 'home': Sim.park(u); return;
    case 'port': delete S.units[u.id]; return;
  }
  Sim.park(u);
};
Sim.arrive = function (u, inc) {
  u.status = 'pastedet'; u.phase = null; u.arrived = S.t; u.path = []; u.pi = 0; u.dest = null; u.walking = false; u.siren = inc.pri === 1 && !UT[u.type].foot;
  Log.add(tgOf(u), u.name, 'Fremme på stedet', 'info');
  if (!inc.arrivedAt) { inc.arrivedAt = S.t; inc.rt = S.t - inc.t0; }
  inc.onScene = true;
  // lifeguard: radio i Nødnett-stil
  if (u.type === 'livredder' && inc.slots.some(s => s.req && !s.accepts.includes('livredder') && s.units.length === 0))
    Log.add('REDNING', u.name, 'Har pasient, ber om ambulanse', 'warn');
  for (const al of S.net.alarms) if (!al.done && al.incId === inc.id && al.helpers.includes(u.id)) Sim.alarmResolve(al);
  if (inc.tpl === 'brannalarm' && !inc.revealed) Sim.reveal(inc);
};
Sim.reveal = function (inc) {
  inc.revealed = true; const tpl = TEMPLATES[inc.tpl];
  if (Math.random() < tpl.falseP) { inc.false = true; inc.work = 1.5; Log.add('BRANN', inc.slots[0].units[0] ? S.units[inc.slots[0].units[0]].name : 'Mannskap', 'Falsk alarm – ingen brann', 'info'); S.stats.falseAlarms++; }
  else {
    inc.pri = 1; inc.work = 12; inc.fx = 'fire'; inc.navn = 'Brann i bygning (utløst alarm)'; inc.rewardMul = 2.4; inc.danger = 0.35; inc.floors = inc.floors || 2;
    inc.slots.push(SL('tb', 'Tankbil', ACC.tank, 'brann'));
    Log.add('BRANN', S.units[inc.slots[0].units[0]].name, 'Reell brann – ber om tankbil', 'warn'); Bus.emit('toast', { msg: 'Alarmen var reell! Det brenner – send tankbil.', kind: 'warn' });
  }
};
Sim.landingFor = function (inc) {
  const L = inc.loc; let best = null, bd = 1e9;
  for (const lot of WORLD.lots) {
    if (!['park', 'natur', 'fjell', 'strand'].includes(lot.kind)) continue;
    const d = Math.hypot(lot.x - L.x, lot.z - L.z); if (d < bd) { bd = d; best = lot; }
  }
  return best && bd < 4.2 * CELL ? { x: best.x, z: best.z, d: bd } : null;
};

/* ==========================================================================
   9. HENDELSER – generering, utsendelse, utfall og belønning
   ========================================================================== */
const ZONE_MUL = { sentrum: 0.9, by: 1.0, bolig: 1.15, strand: 1.15, fjell: 1.5, park: 1.1 };
Sim.active = () => Object.values(S.incidents).filter(i => i.state !== 'ferdig' && i.state !== 'feilet');
Sim.streetAt = function (e, t) {
  const cfg = WORLD.cfg, A = WORLD.nodes[e.a];
  if (e.line < 0) return 'Fergeleia';
  const name = (e.horiz ? cfg.streetsH : cfg.streetsV)[e.line] || 'Veien';
  const cross = e.horiz ? cfg.streetsV[t < 0.5 ? A.i : A.i + 1] : cfg.streetsH[t < 0.5 ? A.j : A.j + 1];
  return name + (cross ? ' ved ' + cross : '');
};
Sim.placeOfLot = function (lot) {
  const dn = lot.dens, zone = lot.kind === 'park' ? 'park' : dn > 0.6 ? 'sentrum' : dn > 0.3 ? 'by' : 'bolig';
  return { x: lot.x, z: lot.z, rp: { a: lot.rp.a, b: lot.rp.b, t: lot.rp.t }, addr: lot.kind === 'park' ? (WORLD.blocks[lot.by][lot.bx].name || lot.addr) : lot.addr, zone, lotId: lot.id, floors: lot.floors || 0 };
};
Sim.pickPlace = function (tpl) {
  const w = WORLD, built = w.lots.filter(l => l.kind === 'bygg' && !l.free && !S.occ[l.id]);
  switch (tpl.loc) {
    case 'bygg': { const l = wpick(built, l => 0.5 + l.dens * 1.4 + (tpl.tags.includes('brann_bygg') && w.cfg.palette === 'bergen' ? 0.8 : 0)); return Sim.placeOfLot(l); }

  const volShare = onSc.length ? vols / onSc.length : 0;
  let pay = 0, score = 0, summary = '';
  const agKey = FRIVILLIGE.includes(inc.lead) ? 'frivillig' : inc.lead;
  if (ok) {
    const rt = inc.rt == null ? inc.expire : inc.rt, ratio = rt / inc.target;
    const payF = ratio <= 0.6 ? 1.3 : ratio <= 1 ? 1.0 : ratio <= 1.5 ? 0.75 : ratio <= 2 ? 0.5 : 0.3;
    score = ratio <= 1 ? 1 : ratio <= 1.5 ? 0.7 : ratio <= 2 ? 0.45 : 0.2;
    let mult = payF;
    const opt = inc.slots.filter(s => !s.req && s.k !== 'nh'); if (opt.length) mult *= 1 + 0.15 * (opt.filter(s => s.units.length).length / opt.length);
    const multi = Sim.agenciesOnScene(inc).size >= 2 || inc.tri; if (multi && inc.tg) { mult *= 1.15; score = Math.min(1, score + 0.05); }
    if (inc.bistand) { mult *= 0.7; score *= 0.85; }
    mult *= 1 - 0.45 * volShare;
    let saved = null;
    if (tpl.med) {
      let surv = ratio <= 1 ? 0.92 : ratio <= 1.5 ? 0.72 : ratio <= 2 ? 0.45 : 0.2;
      if (inc.beachId && S.beaches[inc.beachId] && S.beaches[inc.beachId].staffed) surv += 0.04 * (S.beaches[inc.beachId].up.hjerte * 2 + S.beaches[inc.beachId].up.livboye);
      saved = Math.random() < Math.min(0.98, surv);
      if (saved) S.stats.lives++; else { S.stats.lost++; mult *= 0.5; score *= 0.45; }
    }
    pay = tpl.reward * inc.rewardMul * mult; if (inc.false) pay = tpl.reward * 0.6;
    S.money += pay; S.stats.income += pay; dayStat('income', pay); dayStat('ok', 1); S.stats.solved++;
    const a = S.stats.byAg[agKey]; if (a) { a.n++; a.rt += rt; if (ratio <= 1) a.ok++; }
    if (volShare > 0) { const f = S.stats.byAg.frivillig; f.n++; f.rt += rt; if (ratio <= 1) f.ok++; }
    S.perf = lerp(S.perf, score, 0.14); if (volShare > 0 && score >= 0.7) S.volBonus = Math.min(10, S.volBonus + 1.4);
    Eco.addXp(Math.round((tpl.xp || 10) * (0.5 + 0.5 * score) * (inc.injured ? 1.3 : 1)));
    summary = (inc.false ? 'Falsk alarm' : saved === false ? 'Pasienten døde' : saved ? 'Pasienten reddet' : 'Løst') + ' · responstid ' + fmtDur(rt) + ' (mål ' + fmtDur(inc.target) + ')';
    Log.add(inc.tg || 'SENTRAL', 'Sentral', inc.navn + ' ved ' + inc.loc.addr + ' avsluttet. ' + summary + ' · +' + fmtKr(pay), 'info');
    Bus.emit('toast', { msg: inc.navn + ' løst: +' + fmtKr(pay), kind: saved === false ? 'warn' : 'good' });
    inc.saved = saved;
  } else {
    pay = -tpl.reward * 0.3; S.money += pay; S.stats.costs -= pay; dayStat('cost', -pay); dayStat('fail', 1); S.stats.failed++;
    S.perf = lerp(S.perf, 0, 0.17); const a = S.stats.byAg[agKey]; if (a) a.n++;
    summary = 'Mislyktes – ingen enhet rakk frem i tide';
    Log.add('SENTRAL', 'Sentral', inc.navn + ' ved ' + inc.loc.addr + ' ble ikke håndtert i tide (' + fmtKr(pay) + ')', 'alarm');
    Bus.emit('toast', { msg: inc.navn + ' ble ikke håndtert i tide', kind: 'bad' });
  }
  inc.state = ok ? 'ferdig' : 'feilet'; inc.tEnd = S.t; inc.pay = pay; inc.summary = summary;
  // frigjør enheter: transport, arrest eller retur
  let transported = false, arrested = false;
  for (const u of units) {
    const slot = inc.slots.find(s => s.units.includes(u.id)), T = UT[u.type];
    u.job = null;
    if (!ok || u.status !== 'pastedet') { if (u.status === 'pastedet' || u.status === 'utrykning' || u.status === 'varslet' || u.status === 'mobiliserer') Sim.sendHome(u); else if (u.status === 'retur' || u.status === 'ledig') {} continue; }
    const canTrans = ['ambulanse', 'sanitetsbil', 'hjelpekorpsbil', 'luftambulanse'].includes(u.type);
    if (slot && slot.transport && inc.transport && canTrans) {
      if (Sim.sendToFacility(u, inc)) { transported = true; continue; }
    }
    if (inc.arrest && !arrested && u.org === 'politi' && (UT[u.type].org === 'politi') && Sim.sendToArrest(u)) { arrested = true; continue; }
    Sim.sendHome(u);
  }
  S.done.unshift({ id: inc.id, navn: inc.navn, addr: inc.loc.addr, ok, pay, summary, t: S.t, pri: inc.pri, lead: inc.lead });
  if (S.done.length > 14) S.done.length = 14;
  for (const al of S.net.alarms) if (al.incId === inc.id && !al.done) { al.done = true; al.ok = true; }
  delete S.incidents[inc.id]; Bus.emit('incidentDone', inc);
};
Sim.sendToFacility = function (u, inc) {
  const T = UT[u.type]; let best = null, bc = 1e9;
  for (const id in S.stations) {
    const st = S.stations[id]; if (ST[st.type].rolle !== 'helse') continue; if (st.type === 'legevakt' && inc.pri < 3) continue;
    const lot = WORLD.lotById.get(st.lotId);
    let c; if (T.model === 'heli') c = Math.hypot(lot.x - u.x, lot.z - u.z) / 3; else { const r = WORLD.nav.route(Sim.unitRP(u), lot.rp); c = r.ok ? r.cost : 1e9; }
    if (c < bc) { bc = c; best = { st, lot }; }
  }
  if (!best) return false;
  u.siren = inc.pri <= 2; u.status = 'transport'; u.phase = 'drive'; u.dest = 'hosp'; u.boarded = -1; u.flown = 0; u.onFerry = false;
  if (T.model === 'heli') u.path = [{ x: best.lot.x, z: best.lot.z, m: 1 }];
  else { const r = WORLD.nav.route(Sim.unitRP(u), best.lot.rp); if (!r.ok) return false; u.path = r.pts; }
  u.pi = 0; u.patient = true;
  Log.add(tgOf(u), u.name, 'Pasient om bord – kjører til ' + best.st.name, 'info'); return true;
};
Sim.sendToArrest = function (u) {
  let best = null, bc = 1e9;
  for (const id in S.stations) {
    const st = S.stations[id]; if (st.type !== 'politistasjon' && st.type !== 'arrest') continue;
    const lot = WORLD.lotById.get(st.lotId), r = WORLD.nav.route(Sim.unitRP(u), lot.rp);
