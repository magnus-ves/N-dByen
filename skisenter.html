<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">
<meta name="description" content="Skisjefen – bygg og driv ditt eget skisenter på et tilfeldig fjell eller på et ekte sted fra OpenStreetMap.">
<title>Skisjefen – bygg ditt eget skisenter</title>
<style>
:root{
  --navy:#1b2a4a; --navy2:#2a3f6b; --ice:#eaf4ff; --snow:#ffffff; --accent:#ff7a59; --accent2:#ffb347;
  --ok:#2fa84f; --warn:#e8a317; --bad:#d93a3a; --text:#1b2a4a; --muted:#5d6f8f;
  --glass:rgba(255,255,255,.9); --line:rgba(27,42,74,.12); --shadow:0 6px 22px rgba(12,24,52,.22);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#16223f;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
b,strong{font-weight:700}

/* ---------- Statuslinje ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 6px calc(8px + env(safe-area-inset-left));pointer-events:none}
#top>*{pointer-events:auto}
.chip{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:6px 11px;box-shadow:var(--shadow);
  font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px;line-height:1.1}
.chip small{color:var(--muted);font-size:11px;display:block}
.chip .short{display:none}
.chip.name{flex-direction:column;align-items:flex-start;gap:1px;border-radius:12px;padding:5px 12px;max-width:240px;overflow:hidden}
.chip.name b{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.chip.click{cursor:pointer}
.chip.click:hover{background:#fff}
.ib{width:38px;height:38px;border-radius:12px;background:var(--glass);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}
.ib:hover{background:#fff}
#tMoney b{color:#16683a}
#tMoney.neg b{color:var(--bad)}
.stars{color:#f2a900;letter-spacing:-1px;font-size:15px}
.speed{display:flex;background:var(--glass);border-radius:999px;box-shadow:var(--shadow);padding:3px;gap:2px}
.speed button{padding:5px 10px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.speed button.on{background:var(--navy);color:#fff}
.btn{padding:8px 14px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;box-shadow:var(--shadow);font-size:14px}
.btn:hover{filter:brightness(1.12)}
.btn.accent{background:linear-gradient(135deg,var(--accent),#ff5470);color:#fff}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:10px}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.spacer{flex:1}

/* ---------- Hint og info ---------- */
#hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top));z-index:25;width:max-content;max-width:min(92vw,640px);
  background:rgba(27,42,74,.92);color:#fff;border-radius:14px;padding:8px 10px 8px 14px;font-size:14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
#hint .ht{flex:1}
#hint .ht small{display:block;opacity:.8;font-size:12px;margin-top:2px}
#hint .ht .warn{color:#ffd27a}
#hint button{background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:6px 10px;font-weight:700}
#hint button.go{background:var(--ok)}
#info{position:fixed;left:calc(8px + env(safe-area-inset-left));bottom:calc(86px + env(safe-area-inset-bottom));z-index:20;background:var(--glass);border-radius:12px;
  padding:6px 10px;font-size:12px;box-shadow:var(--shadow);line-height:1.4;max-width:60vw;pointer-events:none}
#info b{font-size:13px}
#attrib{position:fixed;right:calc(6px + env(safe-area-inset-right));bottom:calc(86px + env(safe-area-inset-bottom));z-index:20;font-size:11px;background:rgba(255,255,255,.8);
  padding:2px 7px;border-radius:6px;color:#333}
#attrib a{color:#1a4fa0}
#maptools{position:fixed;right:calc(8px + env(safe-area-inset-right));top:calc(108px + env(safe-area-inset-top));z-index:20;display:flex;flex-direction:column;gap:6px}
#maptools .ib.on{background:var(--navy);color:#fff}

/* ---------- Verktøylinje ---------- */
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:4px;padding:5px;
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px;box-shadow:var(--shadow);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
#bar button{min-width:62px;padding:6px 6px 5px;border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--navy);position:relative;flex-shrink:0}
#bar button .i{font-size:21px;line-height:1}
#bar button:hover{background:rgba(27,42,74,.07)}
#bar button.on{background:var(--navy);color:#fff}
#bar .sep{width:1px;background:var(--line);margin:6px 2px;flex-shrink:0}
.badge{position:absolute;top:2px;right:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px;font-weight:800}
#sub{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:29;display:flex;gap:6px;padding:6px;
  background:rgba(255,255,255,.94);border-radius:16px;box-shadow:var(--shadow);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:thin}
#sub .it{width:118px;flex-shrink:0;border-radius:12px;padding:7px 6px;text-align:center;background:#f3f7fd;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
#sub .it:hover{border-color:#bcd0ee}
#sub .it.on{border-color:var(--accent);background:#fff4ef}
#sub .it .i{font-size:24px}
#sub .it b{font-size:12.5px;line-height:1.15}
#sub .it small{font-size:11px;color:var(--muted);line-height:1.15}
#sub .it.locked{opacity:.55}
#sub .it.locked small{color:#a0522d}

/* ---------- Panel ---------- */
#panel{position:fixed;right:calc(8px + env(safe-area-inset-right));top:calc(60px + env(safe-area-inset-top));bottom:calc(88px + env(safe-area-inset-bottom));width:360px;z-index:28;
  background:rgba(255,255,255,.96);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
#panel>header{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 16px;border-bottom:1px solid var(--line)}
#panel>header h3{margin:0;font-size:17px;flex:1}
#panel .pb{padding:10px 14px 16px;overflow-y:auto;flex:1;font-size:14px;-webkit-overflow-scrolling:touch}
#panel .x{width:32px;height:32px;border-radius:10px;background:#eef3fa;font-size:16px}
.sec{margin:12px 0 6px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;align-items:center;gap:8px;margin:5px 0}
.row .lbl{flex:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13.5px}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:8px;border-radius:99px;background:#e5ecf6;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.meter{display:grid;grid-template-columns:110px 1fr 38px;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.meter span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.note{font-size:12.5px;color:var(--muted);line-height:1.4}
.warnbox{background:#fff3e0;border-radius:10px;padding:8px 10px;font-size:13px;color:#8a4b00;margin:6px 0}
.okbox{background:#e8f7ec;border-radius:10px;padding:8px 10px;font-size:13px;color:#1d6b35;margin:6px 0}
.thought{background:#f3f7fd;border-radius:12px;padding:7px 10px;margin:5px 0;font-size:13.5px;position:relative}
.thought small{color:var(--muted);display:block;font-size:11px}
.staffrow{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.staffrow .cnt{display:flex;align-items:center;gap:6px}
.staffrow .cnt b{min-width:24px;text-align:center;font-size:16px}
.staffrow .cnt button{width:30px;height:30px;border-radius:9px;background:#eef3fa;font-weight:800;font-size:16px}
input[type=range]{width:100%;accent-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--navy)}
canvas.chart{width:100%;height:110px;display:block;background:#f6f9fd;border-radius:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

/* ---------- Toasts ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(110px + env(safe-area-inset-top));z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{background:rgba(27,42,74,.94);color:#fff;padding:9px 14px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);animation:tin .25s ease-out;text-align:center}
.toast.good{background:rgba(29,120,62,.95)}
.toast.bad{background:rgba(190,45,45,.95)}
.toast.gold{background:linear-gradient(135deg,#f6a700,#ff7a59)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ---------- Modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(10,18,36,.55);padding:16px}
#modalRoot.show{display:grid}
.modal{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(980px,100%);height:min(760px,calc(100vh - 32px))}
.modal>header{padding:16px 20px 6px;font-size:20px;font-weight:800}
.modal .mb{padding:6px 20px 12px;overflow-y:auto;font-size:14.5px;line-height:1.5;flex:1}
.modal>footer{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.modal h4{margin:12px 0 4px}
.modal ul{padding-left:20px;margin:6px 0}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.slot .lbl{flex:1;font-size:13.5px}
.slot .lbl small{display:block;color:var(--muted)}

/* ---------- Kartvelger ---------- */
.picker{display:grid;grid-template-columns:300px 1fr;gap:0;height:100%;min-height:0}
.picker .side{padding:12px 16px;overflow-y:auto;border-right:1px solid var(--line);font-size:14px}
.picker .mapwrap{position:relative;min-height:300px}
#pickMap{position:absolute;inset:0}
.picker input[type=text]{width:100%;padding:9px 11px;border-radius:10px;border:1.5px solid #c9d6ea;font-size:15px}
.results{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.results button{text-align:left;padding:7px 9px;border-radius:9px;background:#f1f5fb;font-size:13px}
.results button:hover{background:#e3ecf8}
.quick{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.quick button{padding:5px 9px;border-radius:999px;background:#eef3fa;font-size:12.5px;font-weight:600}
.radio{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer;font-size:13.5px}
.radio input{margin-top:3px;accent-color:var(--accent)}
.seg{display:flex;gap:4px;margin:6px 0}
.seg button{flex:1;padding:6px;border-radius:9px;background:#eef3fa;font-weight:700;font-size:13px}
.seg button.on{background:var(--navy);color:#fff}

/* ---------- Hovedmeny ---------- */
#menu{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:linear-gradient(180deg,#0f1c3a 0%,#2a4a86 45%,#8fb6e8 75%,#dcecff 100%);padding:16px}
#menu svg.mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:55%;pointer-events:none}
#menuSnow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mcard{position:relative;z-index:2;background:rgba(255,255,255,.93);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(520px,100%);padding:22px 24px 20px;margin:auto}
.mcard h1{margin:0;font-size:40px;letter-spacing:-.02em;color:var(--navy);display:flex;align-items:center;gap:10px}
.mcard .sub{margin:2px 0 14px;color:var(--muted);font-size:15px}
.mcard label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.mcard input[type=text],.mcard select{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid #c9d6ea;font-size:15px;background:#fff;color:var(--text)}
.mcard .desc{font-size:13px;color:var(--muted);margin:6px 2px;min-height:34px;line-height:1.4}
.bigrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 10px}
.big{padding:16px 10px;border-radius:16px;font-size:16px;font-weight:800;color:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px}
.big .i{font-size:30px}
.big small{font-weight:600;font-size:12px;opacity:.9}
.big.a{background:linear-gradient(135deg,#3d7be0,#2a4a86)}
.big.b{background:linear-gradient(135deg,var(--accent),#e8456b)}
.minrow{display:flex;gap:8px;flex-wrap:wrap}
.minrow .btn{flex:1}
.mcard .chk{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--text);font-size:13.5px}
.mfoot{font-size:11.5px;color:var(--muted);margin-top:12px;text-align:center}

/* ---------- Lasting ---------- */
#loading{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(10,18,36,.7)}
#loading .box{background:#fff;border-radius:20px;padding:24px 28px;text-align:center;min-width:280px;max-width:90vw;box-shadow:var(--shadow)}
.spinner{width:46px;height:46px;border-radius:50%;border:5px solid #dfe8f5;border-top-color:var(--accent);margin:0 auto 12px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadSteps{font-size:13px;color:var(--muted);text-align:left;margin-top:8px;line-height:1.6}

@media (max-width:760px){
  #top{gap:4px;padding-top:calc(4px + env(safe-area-inset-top))}
  .chip{font-size:11.5px;padding:5px 7px;gap:3px}
  .chip.name{display:none}
  .chip .long{display:none}
  .chip .short{display:inline}
  .stars{display:none}
  #tRating::before{content:'★';color:#f2a900}
  .ib{width:32px;height:32px;font-size:15px;border-radius:10px}
  .speed{padding:2px}
  .speed button{padding:4px 6px;font-size:11.5px}
  #top .btn{padding:5px 9px;font-size:12px;border-radius:10px}
  body.pOpen #info{display:none}
  #info .cur{display:none}
  #panel{left:6px;right:6px;width:auto;top:auto;bottom:calc(80px + env(safe-area-inset-bottom));max-height:58vh;border-radius:18px 18px 14px 14px}
  #bar{gap:2px;padding:4px;border-radius:15px}
  #bar button{min-width:46px;font-size:9.5px;padding:4px 2px}
  #bar button .i{font-size:18px}
  #bar .sep{margin:6px 0}
  #sub{bottom:calc(74px + env(safe-area-inset-bottom))}
  #sub .it{width:102px}
  #info{bottom:calc(78px + env(safe-area-inset-bottom));max-width:66vw;font-size:10.5px;padding:4px 8px;line-height:1.35}
  #info b{font-size:11.5px}
  #attrib{bottom:calc(78px + env(safe-area-inset-bottom));font-size:10px}
  #hint{top:calc(84px + env(safe-area-inset-top));font-size:13px}
  #toasts{top:calc(150px + env(safe-area-inset-top))}
  #maptools{top:calc(140px + env(safe-area-inset-top))}
  .picker{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .picker .side{border-right:0;border-bottom:1px solid var(--line);max-height:44vh}
  .modal.wide{height:calc(100vh - 32px)}
  .mcard h1{font-size:32px}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <header id="top">
    <button class="ib" id="bMenu" title="Meny">☰</button>
    <div class="chip name click" id="tName"><b>Skisenter</b><small id="tPlace"></small></div>
    <div class="chip click" id="tMoney" title="Økonomi">💰 <b>0 kr</b></div>
    <div class="chip" id="tDate" title="Dato og klokkeslett">📅 <b>–</b></div>
    <div class="chip" id="tWeather" title="Vær">–</div>
    <div class="chip click" id="tGuests" title="Gjester i bakken nå / i dag">👥 <b>0</b></div>
    <div class="chip click" id="tRating" title="Rating"><span class="stars">☆☆☆☆☆</span><b>0,0</b></div>
    <div class="speed" id="tSpeed">
      <button data-s="0" title="Pause (mellomrom)">❚❚</button>
      <button data-s="1" title="Normal fart (1)">1×</button>
      <button data-s="2" title="Dobbel fart (2)">2×</button>
      <button data-s="3" title="Trippel fart (3)">3×</button>
    </div>
    <button class="btn accent hidden" id="bSeason">▶ Åpne sesongen</button>
  </header>
  <div id="hint" class="hidden"></div>
  <div id="maptools">
    <button class="ib" id="bSlope" title="Vis bratthet (vanskelighetsgrad)">📐</button>
    <button class="ib" id="bZin" title="Zoom inn">＋</button>
    <button class="ib" id="bZout" title="Zoom ut">－</button>
    <button class="ib" id="bCenter" title="Sentrer kartet">🎯</button>
    <button class="ib" id="bHelp" title="Hjelp">?</button>
  </div>
  <div id="info"></div>
  <div id="attrib" class="hidden">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap-bidragsytere</a></div>
  <div id="sub" class="hidden"></div>
  <nav id="bar"></nav>
  <aside id="panel" class="hidden"><header><h3 id="pTitle"></h3><button class="x" id="pClose" title="Lukk">✕</button></header><div class="pb" id="pBody"></div></aside>
  <div id="toasts"></div>
</div>

<div id="menu">
  <canvas id="menuSnow"></canvas>
  <svg class="mtn" viewBox="0 0 1200 600" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 600 L0 380 L140 250 L230 320 L380 140 L470 230 L560 170 L700 40 L820 210 L900 160 L1030 300 L1120 240 L1200 300 L1200 600 Z" fill="#c9dcf5"/>
    <path d="M380 140 L430 190 L400 200 L360 175 Z M700 40 L760 120 L720 110 L690 140 L655 105 Z M900 160 L940 200 L905 205 Z" fill="#fff"/>
    <path d="M0 600 L0 470 L180 380 L330 450 L520 330 L640 420 L800 340 L980 440 L1200 380 L1200 600 Z" fill="#e8f1fc"/>
    <path d="M0 600 L0 540 L300 500 L600 545 L900 495 L1200 535 L1200 600 Z" fill="#ffffff"/>
    <g fill="#24543f"><path d="M90 520 l14 -40 l14 40 z M120 525 l10 -30 l10 30 z M980 510 l14 -42 l14 42 z M1010 515 l10 -28 l10 28 z M1050 520 l12 -34 l12 34 z"/></g>
  </svg>
  <div class="mcard">
    <h1>⛷️ Skisjefen</h1>
    <div class="sub">Bygg og driv ditt eget skisenter</div>
    <label for="mName">Navn på skisenteret</label>
    <input type="text" id="mName" maxlength="40" value="Fjellheim skisenter">
    <label for="mScen">Spillmodus</label>
    <select id="mScen"></select>
    <div class="desc" id="mScenDesc"></div>
    <label class="chk" id="mUnlockRow"><input type="checkbox" id="mUnlock"> Alt låst opp fra start</label>
    <div class="bigrow">
      <button class="big a" id="mRandom"><span class="i">🏔️</span>Tilfeldig fjell<small>Generert terreng</small></button>
      <button class="big b" id="mReal"><span class="i">🗺️</span>Velg et ekte sted<small>Ekte høyder og kartdata</small></button>
    </div>
    <div class="minrow">
      <button class="btn ghost" id="mContinue">▶ Fortsett</button>
      <button class="btn ghost" id="mLoad">📂 Last inn</button>

  ['Tegn en nedfart ⛷️', 'Velg <b>Bakker → Nedfart</b> og tegn med musa eller fingeren fra toppen av heisen og ned igjen. Fargen viser vanskelighetsgraden – <b style="color:#2fa84f">grønn</b>, <b style="color:#2f6fd6">blå</b>, <b style="color:#d93a3a">rød</b> eller <b>svart</b> – og regnes ut fra brattheten. Nybegynnere trenger grønne bakker!'],
  ['Gjester og fasiliteter ☕', 'Gjestene blir sultne, kalde, trøtte og må på do. Bygg kafé, toaletter, skiutleie og skiskole nær inngangen eller ved heisene. Klikk på en gjest for å se hva den tenker, og følg med i <b>Oversikt</b>.'],
  ['Start sesongen ▶', 'Sett prisen på heiskortet under <b>Økonomi</b>, ansett folk og trykk <b>«Åpne sesongen»</b>. Sesongen varer fra desember til april – jul, vinterferie og påske gir ekstra mange gjester. Styr farten med ⏸ 1× 2× 3×. Lykke til!'],
];
function showIntro(i) {
  const [t, h] = INTRO[i], last = i === INTRO.length - 1;
  const was = G ? G.speed : 0; if (G) setSpeed(0);
  modal({ title: t, html: `<p>${h}</p><p class="note">Steg ${i + 1} av ${INTRO.length}</p>`, buttons: [
    ...(i > 0 ? [{ label: '← Forrige', cls: 'ghost', fn: () => showIntro(i - 1) }] : [{ label: 'Hopp over', cls: 'ghost', fn: () => { lsSet('skisjefen_intro', '1'); if (G) setSpeed(was || 1); } }]),
    { label: last ? 'Kom i gang!' : 'Neste →', cls: 'accent', fn: () => { if (last) { lsSet('skisjefen_intro', '1'); if (G && G.phase === 'season') setSpeed(was || 1); } else showIntro(i + 1); } },
  ] });
}
function placeNear(type, cx, cy) {
  for (let r = 3; r < 15; r++) for (let a = 0; a < 20; a++) {
    const ang = a / 20 * Math.PI * 2, ev = evalBld(type, cx + Math.cos(ang) * r, cy + Math.sin(ang) * r, 0);
    if (ev.ok) { addBld(ev, true); return true; }
  }
  return false;
}
function startRuntime() {
  RT.guests = []; RT.arrivals = []; RT.parked = 0; RT.sel = null; RT.float = []; RT.marks = []; RT.flakes = []; RT.dijCache.clear(); RT.graph = null; RT.follow = null; RT.modalPause = false; RT.warnedMoney = false;
  RT.demand = null; RT.lastNight = null;
  for (const l of G.lifts) { l._q = []; initLiftRT(l); }
  for (const p of G.pistes) initPisteRT(p);
  for (const lp of G.loipes) initLoipeRT(lp);
  for (const b of G.blds) initBldRT(b);
  prepTerrain(); renderTerrain(); renderObjects(); rebuildMasks(); assignStaff(); updatePisteOpen(); buildGraph();
  RT.sun = sunTimes(dateOf(G.day)); RT.clock = G.day * 1440 + G.time;
  $('#menu').classList.add('hidden'); $('#hud').classList.remove('hidden');
  buildBar(); closeSub(); closePanel(); setTool('select'); setSpeed(G.speed);
  if (G.phase === 'season') {
    const t = G.time; morning(); RT.arrivals = RT.arrivals.filter(a => a.t > t);
    if (t > 9 * 60 && t < 16 * 60) { const keep = Math.round(RT.demand.alpine * 0.35); for (let i = 0; i < keep; i++) RT.arrivals.push({ t: t + rr(0, 30), kind: 'alpine' }); RT.arrivals.sort((a, b) => a.t - b.t); }
  }
  resize(); updateHUD(true);
}
function newGame(m) {
  const sc = SCEN.find(s => s.id === $('#mScen').value) || SCEN[0];
  M = m;
  const now = new Date(), year = now.getMonth() >= 4 ? now.getFullYear() : now.getFullYear() - 1;
  G = {
    v: 1, name: ($('#mName').value.trim() || 'Skisenteret').slice(0, 40), scen: sc.id, unlockAll: sc.id === 'free' && $('#mUnlock').checked,
    money: sc.money, debt: 0, price: 240, xcPrice: 120, phase: 'pre', year, seasonNo: 1, day: 0, time: 12 * 60, speed: 1,
    rating: 1.0, ratingParts: null, totalVisitors: 0, tier: 0, staff: { liftop: 0, groomer: 0, patrol: 0, kafe: 0 },
    lifts: [], pistes: [], loipes: [], blds: [], nextId: 1, snow: null, tempAnom: 0, weather: null, freshSnow: 0,
    settings: { snowmaking: true, evening: true, autoStaff: false },
    stats: { today: newDayStats(), yday: null, hist: [], season: newSeasonStats(), seasons: [] },
    cumProfit: 0, goalDone: false, goalFailed: false, bestDay: 0, maxOpenDays: 0, happyEMA: 55, waitEMA: 3, injEMA: 0.0015,
  };
  G.tier = tierNow();
  initSnow(); G.weather = genWeather(0);
  startRuntime();
  cam.x = M.base.ex; cam.y = M.base.ey - Math.min(30, M.GH * 0.3); cam.z = clamp(Math.min(VW, VH) / 60, minZoom(), 20); clampCam();
  if (M.imported) {
    const r = importResort(M.imported);
    G.stats.today = newDayStats(); G.stats.season = newSeasonStats(); G.cumProfit = 0;
    placeNear('cafe', M.base.ex, M.base.ey); placeNear('toilet', M.base.ex, M.base.ey); placeNear('rental', M.base.ex, M.base.ey);
    G.stats.today = newDayStats(); G.stats.season = newSeasonStats(); G.cumProfit = 0;
    autoHire(); assignStaff(); buildGraph();
    toast(`🌍 Hentet ${r.nl} heiser og ${r.np} nedfarter fra OpenStreetMap.`, 'good');
  } else if (M.resortMode) toast('Fant ingen heiser eller nedfarter i OpenStreetMap her – du starter på urørt fjell.');
  if (M.real && !M.osm) toast('Kartobjekter manglet – skog er generert ut fra høyden.');
  if (M.real && M.maxE - M.minE < 60) toast(`Merk: bare ${fmt(M.maxE - M.minE)} m høydeforskjell – bakkene blir slake.`);
  autosave(); updateHUD(true);
  if (!lsGet('skisjefen_intro')) setTimeout(() => showIntro(0), 400);
}
function startRandom() {
  showLoading('Lager et tilfeldig fjell …');
  setTimeout(() => {
    try { const m = genRandomMap((Math.random() * 1e9) | 0); hideLoading(); newGame(m); }
    catch (e) { hideLoading(); console.error(e); toast('Noe gikk galt: ' + e.message, 'bad'); }
  }, 30);
}
function menuSnow() {
  const c = $('#menuSnow'), x = c.getContext('2d'); const fl = [];
  const loop = () => {
    if ($('#menu').classList.contains('hidden')) return;
    if (c.width !== innerWidth || c.height !== innerHeight) { c.width = innerWidth; c.height = innerHeight; }
    while (fl.length < 120) fl.push({ x: Math.random() * c.width, y: Math.random() * c.height, r: rr(1, 3), v: rr(20, 60) });
    x.clearRect(0, 0, c.width, c.height); x.fillStyle = 'rgba(255,255,255,0.85)';
    for (const f of fl) { f.y += f.v / 60; f.x += Math.sin(f.y / 40) * 0.4; if (f.y > c.height) { f.y = -5; f.x = Math.random() * c.width; } x.beginPath(); x.arc(f.x, f.y, f.r, 0, 6.28); x.fill(); }
    requestAnimationFrame(loop);
  };
  if (!RT.menuLoop) { RT.menuLoop = true; requestAnimationFrame(() => { RT.menuLoop = false; loop(); }); }
}

/* ---------- Hovedløkke og oppstart ---------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - lastT) / 1000)); lastT = now; RT.frameDt = dt;
  if (G && M) {
    try { tick(dt); } catch (e) { if (!RT.errShown) { RT.errShown = true; console.error(e); toast('En feil oppstod i simuleringen: ' + e.message, 'bad'); } }
    if (RT.follow) { if (RT.follow.gone || RT.follow.state === 'inside') { if (RT.follow.gone) RT.follow = null; } else { cam.x = lerp(cam.x, RT.follow.x, 0.12); cam.y = lerp(cam.y, RT.follow.y, 0.12); } }
    updateHUD(false);
  }
  try { render(); } catch (e) { if (!RT.rerrShown) { RT.rerrShown = true; console.error(e); } }
  requestAnimationFrame(frame);
}
function boot() {
  document.body.appendChild($('#toasts'));
  resize(); window.addEventListener('resize', resize);
  $('#mScen').innerHTML = SCEN.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  const upd = () => { const s = SCEN.find(q => q.id === $('#mScen').value); $('#mScenDesc').textContent = s.desc; $('#mUnlockRow').classList.toggle('hidden', s.id !== 'free'); };
  $('#mScen').onchange = upd; upd();
  $('#mRandom').onclick = () => startRandom();
  $('#mReal').onclick = () => openPicker();
  $('#mContinue').onclick = () => loadGame('auto');
  $('#mContinue').disabled = !lsGet(SAVE_PREFIX + 'auto');
  $('#mLoad').onclick = () => openSlots('load');
  $('#mHelp').onclick = () => showIntro(0);
  $('#bMenu').onclick = () => openGameMenu();
  $('#tMoney').onclick = () => { closeSub(); togglePanel('econ'); };
  $('#tGuests').onclick = () => { closeSub(); togglePanel('over'); };
  $('#tRating').onclick = () => { closeSub(); togglePanel('over'); };
  $('#tName').onclick = () => { closeSub(); togglePanel('over'); };
  document.querySelectorAll('#tSpeed button').forEach(b => b.onclick = () => setSpeed(+b.dataset.s));
  $('#bSeason').onclick = () => startSeason();
  $('#bSlope').onclick = () => { RT.showSlope = !RT.showSlope; $('#bSlope').classList.toggle('on', RT.showSlope); if (RT.showSlope) toast('📐 Bratthet: grønn < 20 %, blå < 30 %, rød < 42 %, svart ≥ 42 %'); };
  $('#bZin').onclick = () => { cam.z *= 1.3; clampCam(); };
  $('#bZout').onclick = () => { cam.z /= 1.3; clampCam(); };
  $('#bCenter').onclick = () => { cam.x = M.GW / 2; cam.y = M.GH / 2; cam.z = minZoom() / 0.85; clampCam(); };
  $('#bHelp').onclick = () => showIntro(0);
  window.addEventListener('beforeunload', () => { if (G) autosave(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G) autosave(); });
  menuSnow();
  requestAnimationFrame(frame);
}
boot();

</script>
