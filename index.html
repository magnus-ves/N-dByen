<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#DCE6E0">
<meta name="description" content="NødByen – et rolig beredskapsspill i ekte 3D-kart av Oslo og Bergen: 110, 112, 113, frivillige og Nødnett.">
<title>NødByen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <div id="view"></div>
  <div id="labels"></div>
  <div id="hud" class="hidden">
    <header id="topbar" class="glass">
      <button id="btnMenu" class="ib" aria-label="Meny" data-ic="menu"></button>
      <div class="tb-city"><b id="tbCity">Oslo</b><small id="tbSeason">Vår · dag 1</small></div>
      <div class="tb-speed" id="tbSpeed">
        <button data-sp="0" aria-label="Pause" data-ic="pause"></button>
        <button data-sp="1" class="on" title="Ekte tid: ett minutt = 20 sekunder">1×</button>
        <button data-sp="5">5×</button>
        <button data-sp="20">20×</button>
      </div>
      <span class="tb-br"></span>
      <div class="tbc" id="tbClock"><span data-ic="clock"></span><span id="tbTime">07:00</span></div>
      <div class="tbc money" id="tbMoney"><span data-ic="coin"></span><span id="tbMoneyV">kr 0</span></div>
      <div class="tbc clickable" id="tbReady" title="Beredskapsnivå"><svg class="ring" viewBox="0 0 24 24"><circle class="bg" cx="12" cy="12" r="9"/><circle class="fg" id="tbRing" cx="12" cy="12" r="9" stroke-dasharray="0 100"/></svg><span id="tbReadyV">70 %</span></div>
      <div class="tbc clickable" id="tbInc" title="Aktive hendelser"><span data-ic="bell"></span><span id="tbIncV">0</span></div>
      <div class="tbc clickable net" id="tbNet" title="Nødnett-status"><i class="dot" id="tbNetDot"></i><span>Nødnett</span></div>
    </header>
    <div id="alarmBar"></div>
    <div id="mapTools">
      <button class="ib" id="btnCover" aria-label="Vis Nødnett-dekning" data-ic="layers"></button>
      <button class="ib" id="btnRotL" aria-label="Roter venstre" data-ic="rotl"></button>
      <button class="ib" id="btnRotR" aria-label="Roter høyre" data-ic="rotr"></button>
      <button class="ib" id="btnHome" aria-label="Tilbakestill kamera" data-ic="home"></button>
      <button class="ib" id="btnRadio" aria-label="Radio på/av" data-ic="headset"></button>
    </div>
    <div id="miniLog"></div>
    <div id="placeBar" class="glass hidden"></div>
  </div>
  <aside id="panel" class="glass s1 hidden">
    <div id="sheetHandle"><i></i></div>
    <nav id="tabs"></nav>
    <div id="tabBody"></div>
  </aside>
  <div id="screens"></div>
  <div id="modalRoot"></div>
  <div id="toasts"></div>
  <div id="credit">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap-bidragsytere</a> · <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> · <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a><span class="satc"> · Satellitt: Esri, Maxar, Earthstar Geographics</span></div>
  <div class="loadmsg" id="loadMsg">Laster NødByen …<noscript><br>Spillet krever JavaScript.</noscript></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/core.js"></script>
<script src="js/geo.js"></script>
<script src="js/map.js"></script>
<script src="js/city.js"></script>
<script src="js/stations.js"></script>
<script src="js/sim.js"></script>
<script src="js/ui.js"></script>
<script src="js/radio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
